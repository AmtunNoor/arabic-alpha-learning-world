<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fun with Arabic Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body {
    margin:0; padding:0; overflow:hidden; background:#070412; 
    font-family:'Fredoka', 'Jua', sans-serif; color:#fff; user-select:none;
    height: 100vh; width: 100vw; width: 100dvw; height: 100dvh;
  }
  
  
  #intro-splash {
    position: fixed; inset: 0; background: radial-gradient(circle at center, #1b1437 0%, #05030a 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; cursor: pointer; transition: opacity 0.6s cubic-bezier(0.1, 1, 0.1, 1);
    padding: 20px;
  }
  .intro-small { font-size: clamp(14px, 3.5vw, 22px); color: #94a3b8; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
  .intro-star-name { 
    font-family: 'Jua', sans-serif; font-size: clamp(48px, 11vw, 95px); 
    color: #ff7675; text-shadow: 4px 4px 0px #4a154b, 0 10px 30px rgba(255,118,117,0.3);
    margin: 0 0 15px 0; line-height: 1.1; letter-spacing: -1px;
  }
  .intro-sub-details { font-size: clamp(16px, 4vw, 24px); color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
  .intro-kids { font-size: clamp(24px, 6vw, 42px); font-weight: 700; color: #a5b4fc; text-shadow: 2px 2px 0px #1e1b4b; margin-bottom: 45px; }
  .game-subtitle { font-size: clamp(16px, 4vw, 22px); color: #00cec9; font-weight: 700; letter-spacing: 4px; background: rgba(255,255,255,0.05); padding: 8px 24px; border-radius: 30px; animation: glowPulse 1.5s infinite alternate ease-in-out; }

  @keyframes glowPulse { 0% { opacity: 0.5; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1.03); } }

  /* CENTERING DISPATCH RIG */
  #app {
    height: 100vh; width: 100vw; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 20px; position: relative; z-index: 5;
  }
  
  /* MATTE TRANSPARENT MINI TILE */
  .display-tile {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 35px;
    width: auto; height: auto;
    min-width: min(85vw, 320px); max-width: 90vw;
    padding: 30px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* ALPHABET SPECIFIC ENGINE CORE - REMOVED HARD OUTLINES */
  #letter { 
    font-size: clamp(100px, 18vh, 180px); font-family: 'Jua', sans-serif;
    line-height: 1; margin: 0; padding: 0;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }
  
  #action-container { 
    display: flex; flex-direction: column; align-items: center; 
    gap: 8px; opacity: 0; transition: opacity 0.25s ease;
  }
  #action-icon { font-size: clamp(70px, 10vh, 110px); line-height: 1; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.2)); }
  
  #action-text { 
    font-size: clamp(20px, 4vw, 32px); font-weight: 700;
    color: #a5b4fc; text-transform: uppercase; margin: 0; letter-spacing: 2px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  /* ACTION PHYSICAL MOTION FRAMEWORKS */
  .anim-bounce { animation: actBounce 0.3s infinite alternate ease-in-out; }
  .anim-shake { animation: actShake 0.25s infinite linear; }
  .anim-spin { animation: actSpin 1s infinite linear; }
  .anim-pulse { animation: actPulse 0.4s infinite alternate ease-in-out; }

  @keyframes actBounce { 0%{transform:translateY(0);} 100%{transform:translateY(-20px);} }
  @keyframes actShake { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-6px) rotate(-3deg);} 75%{transform:translateX(6px) rotate(3deg);} }
  @keyframes actSpin { 100%{transform:rotate(360deg);} }
  @keyframes actPulse { 0%{transform:scale(1);} 100%{transform:scale(1.12);} }

  .bg { position:fixed; inset:0; background-size:cover; background-position:center; transition:opacity 0.8s ease; z-index:-10; opacity:0; }
  #particle-container { position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden; }
  .particle { position: absolute; pointer-events: none; }

  /* COMPACT STATS HUD */
  #hud { position: fixed; top: min(5vh, 30px); left: 30px; right: 30px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; z-index: 50; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  #level-indicator { background: rgba(0,0,0,0.35); padding: 6px 20px; border-radius: 20px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; }
  
  /* STAR POP REWARD MODULE */
  #star-pop {
    position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
    z-index: 1000; pointer-events: none; opacity: 0; transform: scale(0.1);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #star-pop.boom { opacity: 1; transform: scale(1); }
  .star-graphic { position: relative; font-size: clamp(140px, 22vh, 220px); filter: drop-shadow(0 12px 30px rgba(0,0,0,0.4)); }
  .star-count { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: clamp(38px, 6vh, 65px); color: #fff; font-weight: 700; top: 10px; text-shadow: 0 4px 8px rgba(0,0,0,0.5); }
  .burst-star { position: absolute; font-size: 24px; pointer-events: none; transition: transform 0.5s cubic-bezier(0.1, 0.8, 0.25, 1), opacity 0.5s; opacity: 1; }

  /* CELEBRATION WAVE PATTERNS */
  .celebration-item { position: fixed; bottom: -80px; pointer-events: none; z-index: 2000; font-size: 45px; animation: floatUpward 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes floatUpward {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120vh) translateX(var(--skew)) rotate(var(--rot)); opacity: 0; }
  }

  /* DECOUPLED AUTOMATIC HIDING CONTROLLER HUD */
  #controls { 
    position:fixed; bottom:min(6vh, 40px); left:50%; transform:translateX(-50%); z-index:100; 
    display:flex; align-items: center; gap:10px; background:rgba(12, 10, 24, 0.85); 
    padding:8px 18px; border-radius:50px; border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 15px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    transition: opacity 0.4s ease, transform 0.4s ease; opacity: 1;
  }
  #controls.hidden-hud { opacity: 0; pointer-events: none; transform: translate(-50%, 15px); }
  
  select, button {
    background: #1f1b3a; color: #cbd5e1; border: none; padding: 10px 16px;
    border-radius: 25px; font-family: inherit; font-size: 14px; font-weight:700; cursor: pointer;
    transition: all 0.15s ease;
  }
  select:hover, button:hover { background: #352f5d; color: #fff; }
  select:focus { outline: none; }
  
  #btn-play-pause { background: #5849c4; color: #fff; min-width: 90px; }
  #btn-next { background: #ff7675; color: #fff; }
  #btn-next:disabled { opacity:0.25; cursor:not-allowed; }

  @keyframes cross-screen { 
    0% { transform: translate(0,0) rotate(0deg) scale(0.5); opacity:0; } 
    15% { opacity: 0.7; } 85% { opacity: 0.7; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.1); opacity:0; } 
  }
</style>
</head>
<body onmousemove="resetHudTimer()" ontouchstart="resetHudTimer()">

<div id="intro-splash" onclick="bootEngineWorld()">
  <div class="intro-small">Created By</div>
  <h1 class="intro-star-name">Amtun Noor</h1>
  <div class="intro-sub-details">for</div>
  <div class="intro-kids">Mariam & Hamza</div>
  <div class="game-subtitle">🌟 ARABIC ALPHA WORLD 🌟</div>
</div>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>
<div id="particle-container"></div>

<div id="hud">
  <div id="level-indicator">LEVEL: <span id="lbl-level">1</span></div>
</div>

<div id="star-pop">
  <div class="star-graphic" id="star-anchor">
    ⭐
    <div class="star-count" id="lbl-star-count">0</div>
  </div>
</div>

<div id="app">
  <div id="tile-wrapper" class="display-tile">
    <div id="letter"></div>
    <div id="action-container">
        <div id="action-icon"></div>
        <div id="action-text"></div>
    </div>
  </div>
</div>

<div id="controls">
  <select id="sel-mode" onchange="setMode(this.value)">
    <option value="manual">Manual Play</option>
    <option value="auto">Auto Play</option>
  </select>
  
  <select id="sel-speed" onchange="setSpeed(this.value)">
    <option value="slow">Slow</option>
    <option value="normal" selected>Normal</option>
    <option value="fast">Fast</option>
  </select>

  <button id="btn-play-pause" onclick="togglePlay()">PAUSE</button>
  <button id="btn-next" onclick="triggerNextManual()">NEXT ➡️</button>
</div>

<script>
const letters = [
  { char:"ا", file:"alif.mp3", color:"#ff7675" }, { char:"ب", file:"ba.mp3", color:"#fdcb6e" }, 
  { char:"ت", file:"ta.mp3", color:"#00cec9" }, { char:"ث", file:"thaa.mp3", color:"#a5b4fc" }, 
  { char:"ج", file:"jeem.mp3", color:"#ff7675" }, { char:"ح", file:"haa.mp3", color:"#fdcb6e" }, 
  { char:"خ", file:"kha.mp3", color:"#00cec9" }, { char:"د", file:"daal.mp3", color:"#a5b4fc" }, 
  { char:"ر", file:"raa.mp3", color:"#ff7675" }, { char:"ز", file:"zaa.mp3", color:"#fdcb6e" }, 
  { char:"س", file:"seen.mp3", color:"#00cec9" }, { char:"ش", file:"sheen.mp3", color:"#a5b4fc" }, 
  { char:"ص", file:"saad.mp3", color:"#ff7675" }, { char:"ض", file:"dad.mp3", color:"#fdcb6e" }, 
  { char:"ط", file:"toa.mp3", color:"#00cec9" }, { char:"ظ", file:"zoa.mp3", color:"#a5b4fc" }, 
  { char:"ع", file:"ain.mp3", color:"#ff7675" }, { char:"غ", file:"ghain.mp3", color:"#fdcb6e" }, 
  { char:"ف", file:"fa.mp3", color:"#00cec9" }, { char:"ق", file:"qaaf.mp3", color:"#a5b4fc" }, 
  { char:"ك", file:"kaf.mp3", color:"#ff7675" }, { char:"ل", file:"laam.mp3", color:"#fdcb6e" }, 
  { char:"م", file:"meem.mp3", color:"#00cec9" }, { char:"ن", file:"noon.mp3", color:"#a5b4fc" }, 
  { char:"ه", file:"ha.mp3", color:"#ff7675" }, { char:"و", file:"waw.mp3", color:"#fdcb6e" }, 
  { char:"ي", file:"yaa.mp3", color:"#00cec9" }
];

const actions = [
  { name:"clap", icon:"👏", sound:"clap.mp3", anim:"anim-shake" },
  { name:"fly", icon:"🪶", sound:"fly.mp3", anim:"anim-bounce" },
  { name:"hop", icon:"🐸", sound:"hop.mp3", anim:"anim-bounce" },
  { name:"jump", icon:"🦘", sound:"jump.mp3", anim:"anim-bounce" },
  { name:"look", icon:"👀", sound:"look.mp3", anim:"anim-pulse" },
  { name:"quiet", icon:"🤫", sound:"quiet.mp3", anim:"anim-pulse" },
  { name:"run", icon:"🏃", sound:"run.mp3", anim:"anim-shake" },
  { name:"sit", icon:"🪑", sound:"sit.mp3", anim:"anim-pulse" },
  { name:"sleep", icon:"😴", sound:"sleep.mp3", anim:"anim-pulse" },
  { name:"spin", icon:"🌀", sound:"spin.mp3", anim:"anim-spin" },
  { name:"stomp", icon:"👣", sound:"stomp.mp3", anim:"anim-shake" },
  { name:"stretch", icon:"🤸", sound:"stretch.mp3", anim:"anim-bounce" },
  { name:"strong", icon:"💪", sound:"strong.mp3", anim:"anim-pulse" },
  { name:"walk", icon:"🚶", sound:"walk.mp3", anim:"anim-bounce" },
  { name:"wave", icon:"👋", sound:"wave.mp3", anim:"anim-shake" }
];

const phrases = [
  { file: "amazing.mp3" }, { file: "fantastic.mp3" }, 
  { file: "keep_going.mp3" }, { file: "well_done.mp3" }
];

const themes = [
  { name:"snow1", src:"assets/images/themes/snow.webp", p:["❄️","🌨️","✨"], dist:"v-down" },
  { name:"snow2", src:"assets/images/themes/snow_2.webp", p:["❅","❆","💎"], dist:"a-down" },
  { name:"garden", src:"assets/images/themes/garden.webp", p:["🌸","🦋","🌼"], dist:"spread" },
  { name:"ocean1", src:"assets/images/themes/ocean.webp", p:["🫧","🐟","🐚"], dist:"f-up" },
  { name:"ocean2", src:"assets/images/themes/ocean_2.webp", p:["🫧","🪼","🐙"], dist:"s-right" },
  { name:"forest1", src:"assets/images/themes/forest.webp", p:["🍂","🍁","🦊"], dist:"swirl" },
  { name:"forest2", src:"assets/images/themes/forest_2.webp", p:["🍃","🌱","🍄"], dist:"pop" },
  { name:"rainbow1", src:"assets/images/themes/rainbow.webp", p:["✨","⭐","🌈"], dist:"diag" },
  { name:"rainbow2", src:"assets/images/themes/rainbow_2.webp", p:["✨","🍭","🎨"], dist:"radial" }
];

/* HIGHER SPEED CALIBRATIONS EXCLUSIVELY POPULATED HERE */
const speedMatrix = {
  slow:   { letterWait: 900,  actionWait: 1100, postStar: 1200, autoNext: 1400 },
  normal: { letterWait: 400,  actionWait: 550,  postStar: 600,  autoNext: 800 },
  fast:   { letterWait: 80,   actionWait: 120,  postStar: 150,  autoNext: 250 }
};

let currentIdx = 0;
let starsCollected = 0;
let currentLevel = 1;
let currentMode = "manual"; 
let currentSpeed = "normal"; 
let isEngineRunning = false;
let isPaused = false;
let bgFlip = true;
let isBooted = false;
let autoTimeout = null;
let hudHideTimeout = null;

const audioCache = {};
const ambient = new Audio("assets/sounds/system/ambient.mp3");

const el = {
  letter: document.getElementById("letter"),
  actionIcon: document.getElementById("action-icon"),
  actionText: document.getElementById("action-text"),
  actionCon: document.getElementById("action-container"),
  tile: document.getElementById("tile-wrapper"),
  pCon: document.getElementById("particle-container"),
  lblStar: document.getElementById("lbl-star-count"),
  starPop: document.getElementById("star-pop"),
  lblLevel: document.getElementById("lbl-level"),
  btnNext: document.getElementById("btn-next"),
  btnPlayPause: document.getElementById("btn-play-pause"),
  intro: document.getElementById("intro-splash"),
  controls: document.getElementById("controls")
};

function getSoundPath(filename) {
  if (['amazing.mp3', 'fantastic.mp3', 'keep_going.mp3', 'well_done.mp3'].includes(filename)) return `assets/sounds/phrases/${filename}`;
  if (['level_up.mp3', 'ambient.mp3'].includes(filename)) return `assets/sounds/system/${filename}`;
  if (actions.some(a => a.sound === filename)) return `assets/sounds/actions/${filename}`;
  return `assets/sounds/letters/${filename}`;
}

function preCacheAllAudio() {
  [...letters.map(l=>l.file), ...actions.map(a=>a.sound), ...phrases.map(p=>p.file), "level_up.mp3"].forEach(file => {
    const a = new Audio(getSoundPath(file)); a.preload = "auto"; audioCache[file] = a;
  });
}
preCacheAllAudio();

/* HUD AUTOMATIC DISAPPEARANCE ENGINE */
function resetHudTimer() {
  if (!isBooted) return;
  el.controls.classList.remove("hidden-hud");
  clearTimeout(hudHideTimeout);
  hudHideTimeout = setTimeout(() => {
    if (!isPaused) {
      el.controls.classList.add("hidden-hud");
    }
  }, 2500);
}

function runThemeParticles(theme) {
  el.pCon.innerHTML = "";
  for (let i = 0; i < 30; i++) {
    const p = document.createElement("div"); p.className = "particle";
    p.textContent = theme.p[Math.floor(Math.random() * theme.p.length)];
    p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
    p.style.fontSize = (22 + Math.random() * 26) + "px";
    let tx = 0, ty = 0, rot = 360;
    switch(theme.dist) {
      case "v-down":  tx = (Math.random() - 0.5) * 150; ty = 700; break;
      case "a-down":  tx = -400; ty = 600; break;
      case "spread":  tx = (Math.random() - 0.5) * 1400; ty = (Math.random() - 0.5) * 1000; break;
      case "f-up":    tx = (Math.random() - 0.5) * 200; ty = -700; break;
      case "s-right": tx = 900; ty = (Math.random() - 0.5) * 400; break;
      case "swirl":   tx = (Math.random() - 0.5) * 1000; ty = (Math.random() - 0.5) * 1000; rot = 720; break;
      case "pop":     tx = (Math.random() - 0.5) * 300; ty = (Math.random() - 0.5) * 300; rot = 180; break;
      case "diag":    tx = 600; ty = -600; break;
      case "radial":  const ang = Math.random()*Math.PI*2; tx = Math.cos(ang)*600; ty = Math.sin(ang)*600; break;
    }
    p.style.setProperty('--tx', `${tx}px`); p.style.setProperty('--ty', `${ty}px`); p.style.setProperty('--rot', `${rot}deg`);
    p.style.animation = `cross-screen ${4 + Math.random() * 5}s cubic-bezier(0.1, 0.25, 0.25, 1) infinite`;
    el.pCon.appendChild(p);
  }
}

function changeThemeEnvironment(themeIdx) {
  const theme = themes[themeIdx % themes.length];
  const nextBg = bgFlip ? document.getElementById("bg2") : document.getElementById("bg1");
  const oldBg = bgFlip ? document.getElementById("bg1") : document.getElementById("bg2");
  nextBg.style.backgroundImage = `url('${theme.src}')`; nextBg.style.opacity = "1"; oldBg.style.opacity = "0";
  bgFlip = !bgFlip; runThemeParticles(theme);
}

function launchStarsBurst() {
  const anchor = document.getElementById("star-anchor");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("div"); s.className = "burst-star"; s.textContent = "⭐";
    s.style.left = "45%"; s.style.top = "45%"; anchor.appendChild(s);
    const angle = (i / 12) * Math.PI * 2; const dist = 110 + Math.random() * 70;
    const x = Math.cos(angle) * dist; const y = Math.sin(angle) * dist;
    setTimeout(() => { s.style.transform = `translate(${x}px, ${y}px) scale(0.4)`; s.style.opacity = "0"; }, 20);
    setTimeout(() => s.remove(), 550);
  }
}

function launchIntermissionWave() {
  const items = ["🎈", "🎉", "✨", "🎈", "🎊"];
  for (let i = 0; i < 14; i++) {
    setTimeout(() => {
      const d = document.createElement("div"); d.className = "celebration-item";
      d.textContent = items[i % items.length]; d.style.left = (10 + Math.random() * 80) + "vw";
      d.style.setProperty('--skew', `${(Math.random() - 0.5) * 250}px`);
      d.style.setProperty('--rot', `${360 + Math.random() * 360}deg`);
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2200);
    }, i * 70);
  }
}

async function playSoundFile(filename) {
  return new Promise(resolve => {
    let s = audioCache[filename]; if (!s) s = new Audio(getSoundPath(filename));
    s.currentTime = 0; s.volume = 1.0;
    s.onended = () => resolve(true); s.onerror = () => resolve(false);
    s.play().catch(() => resolve(false));
  });
}

async function runSequence() {
  if (isEngineRunning || isPaused) return;
  isEngineRunning = true; el.btnNext.disabled = true;
  
  const currentLetter = letters[currentIdx % letters.length];
  const currentAction = actions[currentIdx % actions.length]; 
  const chosenPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  const themeIdx = Math.floor(currentIdx / 3) % themes.length;

  const calcLevel = Math.floor(currentIdx / 5) + 1;
  if (calcLevel > currentLevel) {
    currentLevel = calcLevel; el.lblLevel.textContent = currentLevel;
    await playSoundFile("level_up.mp3");
    await new Promise(r => setTimeout(r, 500));
  }

  changeThemeEnvironment(themeIdx);

  el.actionCon.style.opacity = "0"; el.letter.style.transform = "scale(1)";
  el.letter.textContent = currentLetter.char; el.letter.style.color = currentLetter.color;
  el.actionIcon.textContent = currentAction.icon; el.actionIcon.className = ""; 
  el.actionText.textContent = currentAction.name;

  const timing = speedMatrix[currentSpeed];

  // STEP 1: Process Letters Sounds
  await playSoundFile(currentLetter.file);
  await new Promise(res => setTimeout(res, timing.letterWait));
  if (isPaused) { isEngineRunning = false; return; }

  // STEP 2: Display Action
  el.actionCon.style.opacity = "1"; el.actionIcon.classList.add(currentAction.anim);
  await playSoundFile(currentAction.sound);
  await new Promise(res => setTimeout(res, timing.actionWait));
  if (isPaused) { isEngineRunning = false; return; }

  // STEP 3: Complete Phrase Completion Audio Track
  await playSoundFile(chosenPhrase.file);

  // STEP 4: Fire Reward Particle Sequence
  starsCollected++; el.lblStar.textContent = starsCollected;
  el.starPop.classList.add("boom"); launchStarsBurst();
  await new Promise(res => setTimeout(res, timing.postStar));
  el.starPop.classList.remove("boom");

  // INTERMISSION SIGNAL TRIGGER
  launchIntermissionWave();
  await new Promise(res => setTimeout(res, 500));

  currentIdx++; isEngineRunning = false;
  if (currentMode === "manual") el.btnNext.disabled = false;
  if (currentMode === "auto" && !isPaused) autoTimeout = setTimeout(runSequence, timing.autoNext);
}

function togglePlay() {
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(autoTimeout); ambient.pause();
    el.btnPlayPause.textContent = "PLAY"; el.btnPlayPause.style.background = "#2ecc71";
    el.btnNext.disabled = (currentMode === "auto");
    el.controls.classList.remove("hidden-hud"); // Keep controls visible when paused
  } else {
    ambient.play().catch(()=>{});
    el.btnPlayPause.textContent = "PAUSE"; el.btnPlayPause.style.background = "#5849c4";
    if (currentMode === "auto") runSequence(); else el.btnNext.disabled = isEngineRunning;
    resetHudTimer();
  }
}

function setMode(mode) {
  currentMode = mode; clearTimeout(autoTimeout);
  if (mode === "auto") { el.btnNext.disabled = true; if (!isEngineRunning && !isPaused) runSequence(); } 
  else { if (!isEngineRunning && !isPaused) el.btnNext.disabled = false; }
  resetHudTimer();
}

function setSpeed(speed) { currentSpeed = speed; resetHudTimer(); }
function triggerNextManual() { if (currentMode === "manual" && !isEngineRunning && !isPaused) { runSequence(); resetHudTimer(); } }

function bootEngineWorld() {
  if (isBooted) return; isBooted = true;
  
  // Programmatically trigger immersive true fullscreen layout modes
  const doc = document.documentElement;
  if (doc.requestFullscreen) doc.requestFullscreen();
  else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
  else if (doc.msRequestFullscreen) doc.msRequestFullscreen();

  ambient.loop = true; ambient.volume = 0.12; ambient.play().catch(() => {});
  
  el.intro.style.opacity = "0";
  setTimeout(() => { 
    el.intro.remove(); 
    changeThemeEnvironment(0); 
    runSequence(); 
    resetHudTimer();
  }, 600);
}
</script>
</body>
</html>
