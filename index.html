<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Arabic Alpha Fun Learning World</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; 
    overflow:hidden; 
    background:#050505; 
    font-family:Fredoka,sans-serif; 
    color:#fff; 
    user-select:none;
    height: 100vh;
    width: 100vw;
  }
  
  /* TV SCREEN LAYOUT CONTEXT */
  #app {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 40px 20px 110px 20px; /* Kept space clear from the compact bottom menu */
    text-align: center;
    position: relative;
    z-index: 5;
  }
  
  /* ULTRA-TRANSPARENT CENTRAL TILE (Reveals Background Canvas Clearly) */
  .display-tile {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 40px;
    width: 85vw;
    max-width: 1400px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    margin-top: 40px;
  }

  /* SCALE COEFFICIENTS FOR TV VIEWING DISTANCE */
  #letter { 
    font-size: 16vw; 
    font-weight: 700; 
    line-height: 1;
    color: #fff; 
    text-shadow: 0 6px 20px rgba(0,0,0,0.4); 
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #action { 
    font-size: 11vw; 
    line-height: 1;
    transition: all 0.2s ease; 
  }
  #phrase { 
    font-size: 4vw; 
    color: #ffd86b; 
    font-weight: 700; 
    text-shadow: 0 4px 12px rgba(0,0,0,0.6); 
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  @media(min-width: 1600px) {
    #letter { font-size: 260px; }
    #action { font-size: 180px; }
    #phrase { font-size: 65px; }
  }

  /* DYNAMIC MOTION LOOPS */
  .anim-bounce { animation: actBounce 0.4s infinite alternate ease-in-out; }
  .anim-shake { animation: actShake 0.4s infinite linear; }
  .anim-spin { animation: actSpin 1.5s infinite linear; }
  .anim-pulse { animation: actPulse 0.8s infinite alternate ease-in-out; }

  @keyframes actBounce { 0%{transform:translateY(0);} 100%{transform:translateY(-40px);} }
  @keyframes actShake { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-8px) rotate(-3deg);} 75%{transform:translateX(8px) rotate(3deg);} }
  @keyframes actSpin { 100%{transform:rotate(360deg);} }
  @keyframes actPulse { 0%{transform:scale(1);} 100%{transform:scale(1.15);} }

  /* PERSISTENT ENVIRONMENT FIELDS */
  .bg { position:fixed; inset:0; background-size:cover; background-position:center; transition:opacity 0.8s ease; z-index:-10; }
  .overlay { position:fixed; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.35) 100%); z-index:-9; }
  #particle-container { position:fixed; inset:0; pointer-events:none; z-index:-4; }

  /* HUD CONFIGURATION */
  #hud { position: fixed; top: 25px; left: 40px; right: 40px; display: flex; justify-content: space-between; font-size: 28px; font-weight: 700; z-index: 50; text-shadow: 0 3px 6px #000; }
  #level-indicator { background: rgba(0,0,0,0.3); padding: 6px 22px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); }
  
  /* DOPAMINE STAR BURST EFFECTS (FADE-OUT POPUP - NOT A GAME PAUSE) */
  #star-pop {
    position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
    z-index: 1000; pointer-events: none; opacity: 0; transform: scale(0.3);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.4);
  }
  #star-pop.boom { opacity: 1; transform: scale(1); }
  .star-graphic { position: relative; font-size: 320px; filter: drop-shadow(0 15px 40px rgba(0,0,0,0.6)); }
  .star-count { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 90px; color: #fff; font-weight: 700; top: 25px; text-shadow: 0 4px 10px rgba(0,0,0,0.7); }

  /* COMPACT SYSTEM MASCOT BANNER */
  #mascot-banner {
    position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #ff7675, #6c5ce7); padding: 12px 35px;
    border-radius: 0 0 20px 20px; font-size: 22px; font-weight: 700; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
    z-index: 100; box-shadow: 0 8px 25px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 12px;
  }
  #mascot-banner.show { top: 0; }

  /* COMPACTED LOW PROFILE BOTTOM CONTROL RACK */
  #controls { 
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; 
    display:flex; align-items: center; gap:10px; background:rgba(0,0,0,0.75); 
    padding:8px 18px; border-radius:40px; backdrop-filter:blur(15px);
    border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  button { padding:10px 20px; border:none; border-radius:30px; font-weight:bold; font-size:14px; cursor:pointer; background:#222; color:#ccc; transition: all 0.15s ease; }
  button:hover { background: #333; color: #fff; }
  button:active { transform: scale(0.92); }
  button:disabled { opacity:0.3; cursor:not-allowed; }
  .active-setting { background: #6c5ce7 !important; color: #fff !important; box-shadow: 0 0 12px rgba(108,92,231,0.5); }
  #btn-next { background:#ffd86b; color:#111; font-size: 16px; padding: 10px 26px; }

  /* THEME PARTICLE ENGINE PHYSICS */
  @keyframes fall { 0%{transform:translateY(-10vh) rotate(0deg);} 100%{transform:translateY(110vh) rotate(360deg);} }
  @keyframes rise { 0%{transform:translateY(110vh) rotate(0deg); opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(-10vh) rotate(360deg); opacity:0;} }
  @keyframes confetti-fly { 0%{transform:translate(0,0) scale(1) rotate(0deg); opacity:1;} 100%{transform:translate(var(--x), var(--y)) scale(0.4) rotate(540deg); opacity:0;} }
  @keyframes ring-flash { 0% { box-shadow: 0 0 0 0px rgba(255,216,107,0.8); } 100% { box-shadow: 0 0 0 60px rgba(255,216,107,0); } }
  .flash-ring { animation: ring-flash 0.5s ease-out; }
</style>
</head>
<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>
<div class="overlay"></div>
<div id="particle-container"></div>

<div id="hud">
  <div id="level-indicator">LEVEL: <span id="lbl-level">1</span></div>
</div>

<div id="mascot-banner">
  <span id="mascot-avatar">✨</span> <span id="mascot-text">LET'S LEARN!</span>
</div>

<div id="star-pop">
  <div class="star-graphic">
    ⭐
    <div class="star-count" id="lbl-star-count">0</div>
  </div>
</div>

<div id="app">
  <div id="tile-wrapper" class="display-tile">
    <div id="letter">ا</div>
    <div id="action">👋</div>
    <div id="phrase">RUN FAST!</div>
  </div>
</div>

<div id="controls">
  <button id="btn-manual" class="active-setting" onclick="setMode('manual')">MANUAL</button>
  <button id="btn-auto" onclick="setMode('auto')">AUTO</button>
  <span style="border-left: 1px solid rgba(255,255,255,0.15); height: 20px; margin: 0 4px;"></span>
  <button id="spd-slow" onclick="setSpeed('slow')">SLOW</button>
  <button id="spd-normal" class="active-setting" onclick="setSpeed('normal')">NORMAL</button>
  <button id="spd-fast" onclick="setSpeed('fast')">FAST</button>
  <span style="border-left: 1px solid rgba(255,255,255,0.15); height: 20px; margin: 0 4px;"></span>
  <button id="btn-next" onclick="triggerNextManual()">NEXT ➡️</button>
</div>

<script>
/* ===================== FULL DATA ARCHITECTURE ===================== */
const letters = ["ا","ب","ت","ث","ج","ح","خ","د","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];

const actions = [
  { name:"clap", icon:"👏", sound:"clap.mp3", anim:"anim-shake" },
  { name:"fly", icon:"🪶", sound:"fly.mp3", anim:"anim-bounce" },
  { name:"hop", icon:"🐸", sound:"hop.mp3", anim:"anim-bounce" },
  { name:"jump", icon:"🦘", sound:"jump.mp3", anim:"anim-bounce" },
  { name:"look", icon:"👀", sound:"look.mp3", anim:"anim-pulse" },
  { name:"quiet", icon:"🤫", sound:"quiet.mp3", anim:"anim-pulse" },
  { name:"run", icon:"🏃", sound:"run.mp3", anim:"anim-shake" },
  { name:"sit", icon:"🪑", sound:"sit.mp3", anim:"anim-pulse" },
  { name:"sleep", icon:"😴", sound:"sleep.mp3", anim:"anim-pulse" },
  { name:"spin", icon:"🌀", sound:"spin.mp3", anim:"anim-spin" },
  { name:"stomp", icon:"👣", sound:"stomp.mp3", anim:"anim-shake" },
  { name:"stretch", icon:"🤸", sound:"stretch.mp3", anim:"anim-bounce" },
  { name:"strong", icon:"💪", sound:"strong.mp3", anim:"anim-pulse" },
  { name:"walk", icon:"🚶", sound:"walk.mp3", anim:"anim-bounce" },
  { name:"wave", icon:"👋", sound:"wave.mp3", anim:"anim-shake" }
];

const phrases = [
  "RUN FAST", "JUMP HIGH", "STOMP LOUD", "BE QUIET", "CLAP HANDS",
  "FLY AWAY", "SPIN ROUND", "STRETCH HIGH", "STAY STRONG", "WAVE HELLO"
];

/* 10 Unique Themes mapping to your repository paths */
const themes = [
  { name:"snow", src:"assets/images/themes/snow.webp", p:["❄️","🌨️","⚪"] },
  { name:"snow", src:"assets/images/themes/snow_2.webp", p:["❄️","✨","⚪"] },
  { name:"garden", src:"assets/images/themes/garden.webp", p:["🌸","🦋","🍃","🌼"] },
  { name:"ocean", src:"assets/images/themes/ocean.webp", p:["🫧","🐟","🐠"] },
  { name:"ocean", src:"assets/images/themes/ocean_2.webp", p:["🫧","🪼","🌊"] },
  { name:"forest", src:"assets/images/themes/forest.webp", p:["🍂","🍁","🍃"] },
  { name:"forest", src:"assets/images/themes/forest_2.webp", p:["🍄","🌱","🍃"] },
  { name:"rainbow", src:"assets/images/themes/rainbow.webp", p:["✨","⭐","🌈"] },
  { name:"rainbow", src:"assets/images/themes/rainbow_2.webp", p:["✨","🎈","🌈"] },
  { name:"balloon", src:"assets/images/themes/balloon.webp", p:["🎈","✨","🎉"] }
];

/* Preload All Graphics Immediately */
themes.forEach(t => { const img = new Image(); img.src = t.src; });

/* ===================== TRUE SPEED MODE MATRIX ===================== */
/* Speeds completely decoupled to optimize sequential playback without audio overlap */
const speedMatrix = {
  slow:   { letterWait: 1500, actionWait: 1800, phraseWait: 2000, postStar: 800 },
  normal: { letterWait: 900,  actionWait: 1100, phraseWait: 1300, postStar: 500 },
  fast:   { letterWait: 400,  actionWait: 500,  phraseWait: 600,  postStar: 200 }
};

/* ===================== GLOBAL SYSTEM ENGINE STATE ===================== */
let currentIdx = 0;
let starsCollected = 0;
let currentLevel = 1;
let currentMode = "manual"; 
let currentSpeed = "normal"; 
let isEngineRunning = false;
let bgFlip = true;
let autoTimeout = null;

const el = {
  letter: document.getElementById("letter"),
  action: document.getElementById("action"),
  phrase: document.getElementById("phrase"),
  tile: document.getElementById("tile-wrapper"),
  pCon: document.getElementById("particle-container"),
  lblStar: document.getElementById("lbl-star-count"),
  starPop: document.getElementById("star-pop"),
  lblLevel: document.getElementById("lbl-level"),
  btnNext: document.getElementById("btn-next"),
  mascot: document.getElementById("mascot-banner"),
  mascotTxt: document.getElementById("mascot-text")
};

/* Baseline Ambient Engine Channel */
const ambient = new Audio("assets/sounds/system/ambient.mp3");
ambient.loop = true; 
ambient.volume = 0.10;

// Unlock Audio System Context natively
document.addEventListener("pointerdown", () => { if(ambient.paused) ambient.play().catch(()=>{}); }, { once: true });

/* ===================== EFFECT GENERATION ENGINES ===================== */
function runThemeParticles(theme) {
  el.pCon.innerHTML = "";
  const count = 18; 
  for (let i = 0; i < count; i++) {
    createParticle(theme);
  }
}

function createParticle(theme) {
  const p = document.createElement("div");
  p.textContent = theme.p[Math.floor(Math.random() * theme.p.length)];
  p.style.cssText = `position:absolute; left:${Math.random() * 100}vw; font-size:${24 + Math.random() * 26}px; pointer-events:none; z-index:-1;`;
  
  if (theme.name === "ocean" || theme.name === "balloon") {
    p.style.animation = `rise ${5 + Math.random() * 5}s linear infinite`;
  } else {
    p.style.animation = `fall ${5 + Math.random() * 5}s linear infinite`;
  }
  el.pCon.appendChild(p);
}

/* Exciting Visual Burst on Action Completion */
function triggerConfettiBurst() {
  const elements = ["🎉", "✨", "⚡", "🌟", "⭐", "💫", "💥"];
  for (let i = 0; i < 35; i++) {
    const c = document.createElement("div");
    c.textContent = elements[Math.floor(Math.random() * elements.length)];
    c.style.position = "absolute";
    c.style.left = "50vw";
    c.style.top = "55vh";
    c.style.fontSize = (20 + Math.random() * 20) + "px";
    c.style.pointerEvents = "none";
    
    const angle = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 300;
    const x = Math.cos(angle) * speed + "px";
    const y = Math.sin(angle) * speed + "px";
    
    c.style.setProperty('--x', x);
    c.style.setProperty('--y', y);
    c.style.animation = `confetti-fly 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
    
    el.pCon.appendChild(c);
    setTimeout(() => c.remove(), 700);
  }
}

function triggerLevelBalloons() {
  el.pCon.innerHTML = "";
  for(let i=0; i<30; i++) {
    setTimeout(() => {
      const b = document.createElement("div");
      b.textContent = ["🎈", "🎉", "✨", "👑"][Math.floor(Math.random() * 4)];
      b.style.cssText = `position:absolute; left:${5 + Math.random() * 90}vw; font-size:${45 + Math.random()*35}px; pointer-events:none;`;
      b.style.animation = `rise ${3.5 + Math.random()*3}s linear forwards`;
      el.pCon.appendChild(b);
      setTimeout(() => b.remove(), 7000);
    }, i * 100);
  }
}

/* ===================== ENVIROMENT MANAGEMENT ===================== */
function updateEnvironment(themeIndex) {
  const theme = themes[themeIndex % themes.length];
  const nextBg = bgFlip ? document.getElementById("bg2") : document.getElementById("bg1");
  const oldBg = bgFlip ? document.getElementById("bg1") : document.getElementById("bg2");
  
  nextBg.style.backgroundImage = `url('${theme.src}')`;
  nextBg.style.opacity = 1;
  oldBg.style.opacity = 0;
  bgFlip = !bgFlip;

  runThemeParticles(theme);
}

function showMascot(text, duration = 1500) {
  el.mascotTxt.textContent = text;
  el.mascot.classList.add("show");
  setTimeout(() => el.mascot.classList.remove("show"), duration);
}

/* Audio Player Wrapper with Absolute Resource Rejection Isolation */
async function playAudioTrack(src) {
  return new Promise(resolve => {
    const audio = new Audio(src);
    audio.volume = 1.0;
    audio.onended = () => resolve(true);
    audio.onerror = () => resolve(false); // Do not hang the timeline if file is missing
    audio.play().catch(() => resolve(false));
  });
}

/* ===================== ADVANCED LINEAR ASYNC TIMELINE ===================== */
async function runSequence() {
  if (isEngineRunning) return;
  isEngineRunning = true;
  el.btnNext.disabled = true;

  // Clear existing loop layouts
  el.action.className = ""; 
  el.tile.classList.remove("flash-ring");
  
  // Resolve Static/Random Mappings
  const currentLetter = letters[currentIdx % letters.length];
  const currentAction = actions[Math.floor(Math.random() * actions.length)];
  const currentPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  const themeIdx = Math.floor(currentIdx / 5) % themes.length;

  // Calculate Level Configurations Dynamically
  const calculatedLevel = Math.floor(currentIdx / 5) + 1;
  if (calculatedLevel > currentLevel) {
    currentLevel = calculatedLevel;
    el.lblLevel.textContent = currentLevel;
    showMascot(`🎉 LEVEL ${currentLevel}!`, 2000);
    triggerLevelBalloons();
    await playAudioTrack("assets/sounds/system/level-up.mp3");
    await new Promise(r => setTimeout(r, 1200));
  }

  // Swap Theme Map Environments
  updateEnvironment(themeIdx);

  // Set initial viewport states
  el.letter.style.opacity = "1";
  el.action.style.opacity = "0";
  el.phrase.style.opacity = "0";
  
  el.letter.textContent = currentLetter;
  el.action.textContent = currentAction.icon;
  el.phrase.textContent = currentPhrase;

  const speed = speedMatrix[currentSpeed];

  // STEP 1: Process and Play Letter Audio Tracks First
  // Note: Path maps directly to assets/sounds/letters/[LETTER].mp3
  await playAudioTrack(`assets/sounds/letters/${currentLetter}.mp3`);
  await new Promise(resolve => setTimeout(resolve, speed.letterWait));

  // STEP 2: Reveal Action + Play Sound + Fire High-Interest Effects
  el.action.style.opacity = "1";
  el.action.classList.add(currentAction.anim);
  
  // Fire simultaneous Action Voiceover and Success Effect
  triggerConfettiBurst();
  el.tile.classList.add("flash-ring");
  playAudioTrack("assets/sounds/system/success.mp3"); // Secondary sound overlay effect
  
  await playAudioTrack(`assets/sounds/actions/${currentAction.sound}`);
  await new Promise(resolve => setTimeout(resolve, speed.actionWait));

  // STEP 3: Call Out Random Instructional Phrase
  el.phrase.style.opacity = "1";
  await playAudioTrack(`assets/sounds/phrases/phrase.mp3`); 
  await new Promise(resolve => setTimeout(resolve, speed.phraseWait));

  // STEP 4: Instant Non-Blocking Dopamine Star Pop Effect
  starsCollected++;
  el.lblStar.textContent = starsCollected;
  el.starPop.classList.add("boom");
  playAudioTrack("assets/sounds/system/star.mp3");
  
  // Speed window allows star to display fast without blocking execution timeline loops
  await new Promise(resolve => setTimeout(resolve, speed.postStar));
  el.starPop.classList.remove("boom");

  // Advance state structures
  currentIdx++;
  isEngineRunning = false;
  el.btnNext.disabled = false;

  // Handle Loop Automations
  if (currentMode === "auto") {
    autoTimeout = setTimeout(runSequence, 600);
  }
}

/* ===================== CONTROL ACTION MATRIX MAPPINGS ===================== */
function setMode(mode) {
  currentMode = mode;
  document.getElementById("btn-manual").classList.remove("active-setting");
  document.getElementById("btn-auto").classList.remove("active-setting");
  document.getElementById(`btn-${mode}`).classList.add("active-setting");
  
  if (mode === "auto") {
    el.btnNext.style.display = "none";
    if (!isEngineRunning) runSequence();
  } else {
    el.btnNext.style.display = "inline-block";
    clearTimeout(autoTimeout);
  }
}

function setSpeed(speed) {
  currentSpeed = speed;
  document.getElementById("spd-slow").classList.remove("active-setting");
  document.getElementById("spd-normal").classList.remove("active-setting");
  document.getElementById("spd-fast").classList.remove("active-setting");
  document.getElementById(`spd-${speed}`).classList.add("active-setting");
}

function triggerNextManual() {
  if (currentMode === "manual" && !isEngineRunning) {
    runSequence();
  }
}

/* ===================== ENGINE BOOT PROCESS ===================== */
window.addEventListener("load", () => {
  updateEnvironment(0);
  showMascot("WELCOME! CLICK NEXT!", 1000);
});
</script>
</body>
</html>
