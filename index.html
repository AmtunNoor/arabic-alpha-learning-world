<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Arabic Alpha Learning World - Premium TV & Mobile Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; 
    overflow:hidden; 
    background:#080810; 
    font-family:Fredoka,sans-serif; 
    color:#fff; 
    user-select:none;
    height: 100vh;
    width: 100vw;
  }
  
  /* CINEMATIC INTRO OVERLAY SPLASH */
  #intro-splash {
    position: fixed; inset: 0; background: radial-gradient(circle, #1e1b4b 0%, #090514 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s ease;
  }
  .intro-title { font-size: 24px; letter-spacing: 4px; color: #a5b4fc; text-transform: uppercase; margin-bottom: 5px; opacity: 0; transform: translateY(20px); animation: introFade 0.6s 0.3s forwards; }
  .intro-name { font-size: 54px; font-weight: 700; color: #ffd86b; text-shadow: 0 0 30px rgba(255,216,107,0.4); margin-bottom: 40px; opacity: 0; transform: scale(0.85); animation: introPop 0.8s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .intro-sub { font-size: 20px; letter-spacing: 2px; color: #cbd5e1; margin-bottom: 5px; opacity: 0; animation: introFade 0.6s 1.3s forwards; }
  .intro-kids { font-size: 44px; font-weight: 700; background: linear-gradient(45deg, #ff7675, #6c5ce7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(108,92,231,0.3)); opacity: 0; transform: translateY(15px); animation: introFade 0.7s 1.5s forwards; }
  
  @keyframes introFade { to { opacity:1; transform:translateY(0); } }
  @keyframes introPop { to { opacity:1; transform:scale(1); } }

  /* RESPONSIVE VIEWPORT ENGINE CANVAS */
  #app {
    height: 100vh; width: 100vw; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
    padding: min(5vh, 40px) 20px min(12vh, 110px) 20px;
    text-align: center; position: relative; z-index: 5;
  }
  
  /* TILE ELEMENT: COMPLETELY TRANSPARENT & SCREEN-FLUID */
  .display-tile {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    border: 2px solid rgba(255, 255, 255, 0.08); border-radius: min(6vw, 45px);
    width: 90vw; max-width: 1300px; height: 62vh;
    display: flex; flex-direction: column; justify-content: space-around; align-items: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25); transition: all 0.3s ease;
  }

  /* ALPHABET FIRST FOCUS: MEGA BOLD & SEVERELY GRAPHIC */
  #letter { 
    font-size: clamp(140px, 22vh, 280px);
    font-weight: 700; line-height: 1; margin: 0; padding: 0;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.5));
  }
  #action { font-size: clamp(90px, 14vh, 180px); line-height: 1; transition: all 0.25s ease; }
  #phrase { 
    font-size: clamp(24px, 4.5vw, 55px); color: #ffd86b; font-weight: 700; 
    text-shadow: 0 4px 10px rgba(0,0,0,0.7); text-transform: uppercase; letter-spacing: 2px;
  }

  /* ADVANCED THEME MOTION PHYSICS ENGINES */
  .anim-bounce { animation: actBounce 0.4s infinite alternate ease-in-out; }
  .anim-shake { animation: actShake 0.35s infinite linear; }
  .anim-spin { animation: actSpin 1.4s infinite linear; }
  .anim-pulse { animation: actPulse 0.7s infinite alternate ease-in-out; }

  @keyframes actBounce { 0%{transform:translateY(0);} 100%{transform:translateY(-35px);} }
  @keyframes actShake { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-8px) rotate(-3deg);} 75%{transform:translateX(8px) rotate(3deg);} }
  @keyframes actSpin { 100%{transform:rotate(360deg);} }
  @keyframes actPulse { 0%{transform:scale(1);} 100%{transform:scale(1.15);} }

  /* LAYER ENVIRONMENTAL CONTEXTS */
  .bg { position:fixed; inset:0; background-size:cover; background-position:center; transition:opacity 0.8s ease; z-index:-10; }
  .overlay { position:fixed; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.4) 100%); z-index:-9; }
  #particle-container { position:fixed; inset:0; pointer-events:none; z-index:-4; overflow:hidden; }

  /* OVERLAY HUDS & SYSTEM INDICATORS */
  #hud { position: fixed; top: min(4vh, 30px); left: 40px; right: 40px; display: flex; justify-content: space-between; font-size: clamp(18px, 2.5vw, 28px); font-weight: 700; z-index: 50; text-shadow: 0 3px 6px #000; }
  #level-indicator { background: rgba(0,0,0,0.35); padding: 6px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; }
  
  /* NON-BLOCKING EXPRESS REWARD MODE (DOPAMINE POP) */
  #star-pop {
    position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
    z-index: 1000; pointer-events: none; opacity: 0; transform: scale(0.2);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.4);
  }
  #star-pop.boom { opacity: 1; transform: scale(1); }
  .star-graphic { position: relative; font-size: clamp(180px, 30vh, 340px); filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6)); }
  .star-count { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: clamp(50px, 8vh, 95px); color: #fff; font-weight: 700; top: min(3vh, 25px); text-shadow: 0 4px 10px rgba(0,0,0,0.7); }

  /* COMPACT ULTRA-LOW-PROFILE BOTTOM CONTROL BAR */
  #controls { 
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; 
    display:flex; align-items: center; gap:8px; background:rgba(10,8,20,0.85); 
    padding:6px 14px; border-radius:40px; backdrop-filter:blur(20px);
    border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  button { padding:10px 18px; border:none; border-radius:30px; font-weight:bold; font-size:13px; cursor:pointer; background:#1e1e2f; color:#9fa6b2; transition: all 0.15s ease; }
  button:hover { background: #2b2b40; color: #fff; }
  button:active { transform: scale(0.92); }
  button:disabled { opacity:0.25; cursor:not-allowed; }
  .active-setting { background: #6c5ce7 !important; color: #fff !important; box-shadow: 0 0 12px rgba(108,92,231,0.4); }
  #btn-next { background:#ffd86b; color:#111; font-size: 15px; padding: 10px 24px; }

  /* THEME VECTOR PHYSICS MATH ANIMATIONS */
  @keyframes fall { 0%{transform:translateY(-10vh) rotate(0deg);} 100%{transform:translateY(110vh) rotate(360deg);} }
  @keyframes rise { 0%{transform:translateY(110vh) rotate(0deg); opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(-10vh) rotate(360deg); opacity:0;} }
  @keyframes gardenDrift { 0%{transform:translate(-10vw, 20vh) rotate(0deg); opacity:0;} 15%{opacity:0.8;} 85%{opacity:0.8;} 100%{transform:translate(110vw, 80vh) rotate(180deg); opacity:0;} }
  @keyframes forestSwirl { 0%{transform:translateY(-10vh) translateX(0) rotate(0deg);} 50%{transform:translateY(50vh) translateX(40px) rotate(180deg);} 100%{transform:translateY(110vh) translateX(-20px) rotate(360deg);} }
  @keyframes diagRise { 0%{transform:translate(-10vw, 110vh) scale(0.6); opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{transform:translate(110vw, -10vh) scale(1.1); opacity:0;} }
  @keyframes confetti-fly { 0%{transform:translate(0,0) scale(1) rotate(0deg); opacity:1;} 100%{transform:translate(var(--x), var(--y)) scale(0.3) rotate(720deg); opacity:0;} }
  @keyframes flash { 0% { box-shadow: 0 0 0 0px rgba(255,255,255,0.6); } 100% { box-shadow: 0 0 0 45px rgba(255,255,255,0); } }
  .flash-ring { animation: flash 0.45s ease-out; }
</style>
</head>
<body>

<div id="intro-splash">
  <div class="intro-title">Created By</div>
  <div class="intro-name">Amtun Noor</div>
  <div class="intro-sub">for</div>
  <div class="intro-kids">Mariam & Hamza</div>
</div>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>
<div class="overlay"></div>
<div id="particle-container"></div>

<div id="hud">
  <div id="level-indicator">LEVEL: <span id="lbl-level">1</span></div>
</div>

<div id="star-pop">
  <div class="star-graphic">
    ⭐
    <div class="star-count" id="lbl-star-count">0</div>
  </div>
</div>

<div id="app">
  <div id="tile-wrapper" class="display-tile">
    <div id="letter"></div>
    <div id="action"></div>
    <div id="phrase"></div>
  </div>
</div>

<div id="controls">
  <button id="btn-manual" class="active-setting" onclick="setMode('manual')">MANUAL</button>
  <button id="btn-auto" onclick="setMode('auto')">AUTO</button>
  <span style="border-left: 1px solid rgba(255,255,255,0.12); height: 18px; margin: 0 2px;"></span>
  <button id="spd-slow" onclick="setSpeed('slow')">SLOW</button>
  <button id="spd-normal" class="active-setting" onclick="setSpeed('normal')">NORMAL</button>
  <button id="spd-fast" onclick="setSpeed('fast')">FAST</button>
  <span style="border-left: 1px solid rgba(255,255,255,0.12);
