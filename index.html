<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Arabic World </title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; overflow:hidden; background:#080810; 
    font-family:Fredoka,sans-serif; color:#fff; user-select:none;
    height: 100vh; width: 100vw;
  }
  
  /* SPLASH SCREEN */
  #intro-splash {
    position: fixed; inset: 0; background: radial-gradient(circle, #1e1b4b 0%, #090514 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.6s ease;
  }
  .loading-btn { 
    margin-top: 30px; padding: 15px 40px; background: #ffd86b; color: #000; 
    border: none; border-radius: 40px; font-weight: 700; font-size: 20px; cursor: pointer;
    box-shadow: 0 10px 20px rgba(255,216,107,0.3);
  }

  /* VIEWPORT ENGINE */
  #app {
    height: 100vh; width: 100vw; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 20px;
    position: relative; z-index: 5;
  }
  
  .display-tile {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px;
    width: min(85vw, 700px); 
    max-height: 65vh;
    padding: 60px 20px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    transition: all 0.4s ease;
  }

  #letter { 
    font-size: clamp(120px, 22vh, 260px); 
    font-weight: 700; line-height: 1; 
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  #action-container { 
    display: flex; flex-direction: column; align-items: center; 
    margin-top: 20px; transition: all 0.4s ease;
  }
  
  #action-icon { font-size: clamp(80px, 12vh, 140px); line-height: 1; }
  
  #action-text { 
    font-size: clamp(24px, 4vw, 48px); 
    color: #ffd86b; font-weight: 700; 
    text-transform: uppercase; margin-top: 10px;
    letter-spacing: 3px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* FULL SCREEN PARTICLES */
  #particle-container { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .particle { position: absolute; pointer-events: none; }

  /* NAVIGATION & MODES */
  #controls { 
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:100; 
    display:flex; align-items: center; gap:12px; background:rgba(15,15,30,0.9); 
    padding:10px 20px; border-radius:50px; border: 1px solid rgba(255,255,255,0.1);
  }
  
  select, button {
    background: #252545; color: #fff; border: none; padding: 10px 18px;
    border-radius: 25px; font-family: inherit; font-size: 14px; cursor: pointer;
    transition: background 0.2s;
  }
  
  #btn-play-pause { background: #6c5ce7; font-weight: bold; min-width: 90px; }
  #btn-next { background: #ffd86b; color: #000; font-weight: bold; }

  /* ANIMATIONS */
  @keyframes float-full { 
    0% { transform: translate(0,0) rotate(0); opacity:0; } 
    10% { opacity:0.8; } 90% { opacity:0.8; } 
    100% { transform: translate(var(--tx), var(--ty)) rotate(360deg); opacity:0; } 
  }
  
  .bg { position:fixed; inset:0; background-size:cover; background-position:center; transition:opacity 1s ease; z-index:-10; opacity:0; }
</style>
</head>
<body>

<div id="intro-splash">
  <div style="font-size: 50px; font-weight: 700; color: #ffd86b; text-align: center;">ARABIC WORLD</div>
  <button class="loading-btn" onclick="init()">START WORLD</button>
  <div style="margin-top: 15px; color: #a5b4fc; font-size: 12px;">Click to Enable Sound & Visuals</div>
</div>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>
<div id="particle-container"></div>

<div id="app">
  <div id="tile-wrapper" class="display-tile">
    <div id="letter"></div>
    <div id="action-container">
        <div id="action-icon"></div>
        <div id="action-text"></div>
    </div>
  </div>
</div>

<div id="controls">
  <select id="sel-mode" onchange="setMode(this.value)">
    <option value="manual">Manual</option>
    <option value="auto">Auto Play</option>
  </select>
  
  <select id="sel-speed" onchange="setSpeed(this.value)">
    <option value="slow">Slow</option>
    <option value="normal" selected>Normal</option>
    <option value="fast">Express</option>
  </select>

  <button id="btn-play-pause" onclick="togglePlay()">PAUSE</button>
  <button id="btn-next" onclick="triggerNext()">NEXT ➡️</button>
</div>

<script>
const letters = [
  { char:"ا", file:"alif.mp3", color:"#ff7675" }, { char:"ب", file:"ba.mp3", color:"#fdcb6e" }, 
  { char:"ت", file:"ta.mp3", color:"#00cec9" }, { char:"ث", file:"thaa.mp3", color:"#6c5ce7" }, 
  { char:"ج", file:"jeem.mp3", color:"#ff7675" }, { char:"ح", file:"haa.mp3", color:"#fdcb6e" }, 
  { char:"خ", file:"kha.mp3", color:"#00cec9" }, { char:"د", file:"daal.mp3", color:"#6c5ce7" }, 
  { char:"ر", file:"raa.mp3", color:"#ff7675" }, { char:"ز", file:"zaa.mp3", color:"#fdcb6e" }, 
  { char:"س", file:"seen.mp3", color:"#00cec9" }, { char:"ش", file:"sheen.mp3", color:"#6c5ce7" }, 
  { char:"ص", file:"saad.mp3", color:"#ff7675" }, { char:"ض", file:"dad.mp3", color:"#fdcb6e" }, 
  { char:"ط", file:"toa.mp3", color:"#00cec9" }, { char:"ظ", file:"zoa.mp3", color:"#6c5ce7" }, 
  { char:"ع", file:"ain.mp3", color:"#ff7675" }, { char:"غ", file:"ghain.mp3", color:"#fdcb6e" }, 
  { char:"ف", file:"fa.mp3", color:"#00cec9" }, { char:"ق", file:"qaaf.mp3", color:"#6c5ce7" }, 
  { char:"ك", file:"kaf.mp3", color:"#ff7675" }, { char:"ل", file:"laam.mp3", color:"#fdcb6e" }, 
  { char:"م", file:"meem.mp3", color:"#00cec9" }, { char:"ن", file:"noon.mp3", color:"#6c5ce7" }, 
  { char:"ه", file:"ha.mp3", color:"#ff7675" }, { char:"و", file:"waw.mp3", color:"#fdcb6e" }, 
  { char:"ي", file:"yaa.mp3", color:"#00cec9" }
];

const actions = [
  { name:"clap", icon:"👏", sound:"clap.mp3" },
  { name:"fly", icon:"🪶", sound:"fly.mp3" },
  { name:"hop", icon:"🐸", sound:"hop.mp3" },
  { name:"jump", icon:"🦘", sound:"jump.mp3" },
  { name:"look", icon:"👀", sound:"look.mp3" },
  { name:"run", icon:"🏃", sound:"run.mp3" },
  { name:"sleep", icon:"😴", sound:"sleep.mp3" },
  { name:"spin", icon:"🌀", sound:"spin.mp3" },
  { name:"walk", icon:"🚶", sound:"walk.mp3" },
  { name:"wave", icon:"👋", sound:"wave.mp3" }
];

const themes = [
  { name:"snow1", src:"assets/images/themes/snow.webp", p:["❄️","🌨️","✨","☁️","💎"] },
  { name:"snow2", src:"assets/images/themes/snow_2.webp", p:["❅","❆","✨","🧊","⚪"] },
  { name:"garden", src:"assets/images/themes/garden.webp", p:["🌸","🦋","🌼","🐝","🍃"] },
  { name:"ocean", src:"assets/images/themes/ocean.webp", p:["🫧","🐟","🐚","🌊","🐙"] },
  { name:"forest", src:"assets/images/themes/forest.webp", p:["🍂","🍁","🦊","🍄","🌰"] },
  { name:"rainbow", src:"assets/images/themes/rainbow.webp", p:["✨","⭐","🌈","🍭","🎨"] }
];

const speedMatrix = {
  slow:   { letter: 1100, action: 1300, autoNext: 2000 },
  normal: { letter: 600,  action: 750,  autoNext: 1200 },
  fast:   { letter: 150,  action: 200,  autoNext: 400 }
};

let currentIdx = 0;
let currentMode = "manual"; 
let currentSpeed = "normal"; 
let isPaused = false;
let isRunning = false;
let bgFlip = true;
const ambient = new Audio("assets/sounds/ambient.mp3");
ambient.loop = true; ambient.volume = 0.2;

async function init() {
  // Start background music on user click
  ambient.play().catch(() => console.log("Ambient pending user interaction"));
  
  document.getElementById("intro-splash").style.opacity = "0";
  setTimeout(() => {
    document.getElementById("intro-splash").remove();
    runSequence();
  }, 600);
}

function spawnParticles(theme) {
  const container = document.getElementById("particle-container");
  container.innerHTML = "";
  for(let i=0; i<30; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.textContent = theme.p[i % theme.p.length];
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = Math.random() * 100 + "vh";
    p.style.fontSize = (20 + Math.random() * 35) + "px";
    
    // Spread across entire screen width/height
    const tx = (Math.random() - 0.5) * 1200 + "px";
    const ty = (Math.random() - 0.5) * 1200 + "px";
    p.style.setProperty('--tx', tx);
    p.style.setProperty('--ty', ty);
    
    p.style.animation = `float-full ${5 + Math.random()*7}s linear infinite`;
    container.appendChild(p);
  }
}

async function runSequence() {
  if (isRunning || isPaused) return;
  isRunning = true;

  const letter = letters[currentIdx % letters.length];
  const action = actions[currentIdx % actions.length];
  const theme = themes[Math.floor(currentIdx / 3) % themes.length];
  const spd = speedMatrix[currentSpeed];

  // Update Background & Particles
  const nextBg = bgFlip ? "bg2" : "bg1";
  const prevBg = bgFlip ? "bg1" : "bg2";
  document.getElementById(nextBg).style.backgroundImage = `url('${theme.src}')`;
  document.getElementById(nextBg).style.opacity = "1";
  document.getElementById(prevBg).style.opacity = "0";
  bgFlip = !bgFlip;
  spawnParticles(theme);

  // Step 1: Display Letter
  document.getElementById("letter").textContent = letter.char;
  document.getElementById("letter").style.color = letter.color;
  document.getElementById("letter").style.opacity = "1";
  document.getElementById("action-container").style.opacity = "0";
  
  play(`assets/sounds/${letter.file}`);
  await sleep(spd.letter);

  // Step 2: Transition to Action (Icon + Text)
  document.getElementById("letter").style.opacity = "0.3"; // Dim letter slightly
  document.getElementById("action-icon").textContent = action.icon;
  document.getElementById("action-text").textContent = action.name;
  document.getElementById("action-container").style.opacity = "1";
  
  play(`assets/sounds/${action.sound}`);
  await sleep(spd.action);

  // Step 3: Phrase Audio Only (No text change)
  play(`assets/sounds/well_done.mp3`);
  await sleep(spd.action);

  currentIdx++;
  isRunning = false;

  if (currentMode === "auto" && !isPaused) {
    setTimeout(runSequence, spd.autoNext);
  }
}

function togglePlay() {
  isPaused = !isPaused;
  document.getElementById("btn-play-pause").textContent = isPaused ? "PLAY" : "PAUSE";
  if (!isPaused && currentMode === "auto") runSequence();
}

function triggerNext() { if (!isRunning) runSequence(); }
function setMode(m) { currentMode = m; if(m === 'auto') runSequence(); }
function setSpeed(s) { currentSpeed = s; }

function play(path) {
  const s = new Audio(path);
  s.play().catch(()=>{});
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
