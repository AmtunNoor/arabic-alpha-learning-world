<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fun with Arabic Alpha World</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body {
    margin:0; padding:0; overflow:hidden; background:#070412; 
    font-family:'Fredoka', 'Jua', sans-serif; color:#fff; user-select:none;
    height: 100vh; width: 100vw; width: 100dvw; height: 100dvh;
  }
  
  /* SPLASH SCREEN */
  #intro-splash {
    position: fixed; inset: 0; background: radial-gradient(circle at center, #1b1437 0%, #05030a 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; cursor: pointer; transition: opacity 0.6s ease;
    padding: 20px;
  }
  .intro-small { font-size: clamp(14px, 3.5vw, 22px); color: #94a3b8; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
  .intro-star-name { 
    font-family: 'Jua', sans-serif; font-size: clamp(48px, 11vw, 95px); 
    color: #ff7675; text-shadow: 4px 4px 0px #4a154b, 0 10px 30px rgba(255,118,117,0.3);
    margin: 0 0 15px 0; line-height: 1.1; letter-spacing: -1px;
  }
  .intro-sub-details { font-size: clamp(16px, 4vw, 24px); color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
  .intro-kids { font-size: clamp(24px, 6vw, 42px); font-weight: 700; color: #a5b4fc; text-shadow: 2px 2px 0px #1e1b4b; margin-bottom: 45px; }
  .game-subtitle { font-size: clamp(16px, 4vw, 22px); color: #00cec9; font-weight: 700; letter-spacing: 4px; background: rgba(255,255,255,0.05); padding: 8px 24px; border-radius: 30px; animation: glowPulse 1.5s infinite alternate ease-in-out; }

  @keyframes glowPulse { 0% { opacity: 0.5; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1.03); } }

  /* GAME UI */
  #app { height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; z-index: 5; }
  .display-tile {
    background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 35px;
    width: auto; height: auto; min-width: min(85vw, 320px); max-width: 90vw;
    padding: 30px 40px; display: flex; flex-direction: column; align-items: center; gap: 15px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  }

  #letter { font-size: clamp(100px, 18vh, 180px); font-family: 'Jua', sans-serif; line-height: 1; margin: 0; }
  
  #action-container { display: none; flex-direction: column; align-items: center; gap: 8px; }
  #action-icon { font-size: clamp(70px, 10vh, 110px); line-height: 1; }
  #action-text { font-size: clamp(20px, 4vw, 32px); font-weight: 700; color: #a5b4fc; text-transform: uppercase; margin: 0; letter-spacing: 2px; }

  /* VISUALLY CONTRASTED ANIMATION RHYTHMS */
  .anim-hop { animation: actHop 0.25s infinite alternate ease-in-out; }
  .anim-jump { animation: actJump 0.6s infinite ease-in-out; }
  .anim-shake { animation: actShake 0.25s infinite linear; }
  .anim-spin { animation: actSpin 1.2s infinite linear; }
  .anim-pulse { animation: actPulse 0.5s infinite alternate ease-in-out; }
  .anim-fly { animation: actFly 0.7s infinite alternate ease-in-out; }

  @keyframes actHop { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
  @keyframes actJump { 
    0%, 100% { transform: translateY(0) scaleY(1); } 
    10% { transform: translateY(5px) scaleY(0.85); }
    50% { transform: translateY(-50px) scaleY(1.1); }
    85% { transform: translateY(0) scaleY(1.0); } 
  }
  @keyframes actShake { 0%,100%{transform:translateX(0) rotate(0);} 25%{transform:translateX(-6px) rotate(-3deg);} 75%{transform:translateX(6px) rotate(3deg);} }
  @keyframes actSpin { 100%{transform:rotate(360deg);} }
  @keyframes actPulse { 0%{transform:scale(1);} 100%{transform:scale(1.15);} }
  @keyframes actFly { 0% { transform: translateY(-8px); } 100% { transform: translateY(12px); } }

  /* BACKGROUND ELEMENT RENDERING */
  .bg-layer { 
    position: fixed; inset: 0; 
    width: 100vw; height: 100vh; 
    width: 100dvw; height: 100dvh;
    object-fit: cover; object-position: center;
    transition: opacity 1s ease; z-index: -10; opacity: 0; 
  }
  
  #particle-container { position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden; }
  .particle { position: absolute; pointer-events: none; }
  
  @keyframes cross-screen { 
    0% { transform: translate(0,0) rotate(0deg) scale(0.5); opacity:0; } 
    15% { opacity: 0.7; } 85% { opacity: 0.7; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.1); opacity:0; } 
  }

  /* REWARD INTERFACE */
  #hud { position: fixed; top: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; font-size: 18px; z-index: 50; }
  #level-indicator, #star-score { background: rgba(0,0,0,0.35); padding: 6px 20px; border-radius: 20px; backdrop-filter: blur(5px); }

  #star-pop { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 1000; pointer-events: none; opacity: 0; transform: scale(0.1); transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #star-pop.boom { opacity: 1; transform: scale(1); }
  .star-graphic { position: relative; font-size: 180px; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.4)); }
  .star-count { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 50px; color: #fff; font-weight: 700; top: 10px; }

  /* OVERLAY HUD CONTROLS */
  #controls { 
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:100; 
    display:flex; align-items: center; gap:10px; background:rgba(12, 10, 24, 0.85); 
    padding:8px 18px; border-radius:50px; border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(15px); transition: opacity 0.4s ease;
  }
  #controls.hidden-hud { opacity: 0; pointer-events: none; }
  select, button { background: #1f1b3a; color: #cbd5e1; border: none; padding: 10px 16px; border-radius: 25px; font-family: inherit; font-weight:700; cursor: pointer; }
  #btn-play-pause { background: #5849c4; color: #fff; min-width: 90px; }
</style>
</head>
<body onmousemove="resetHudTimer()" ontouchstart="resetHudTimer()">

<div id="intro-splash" onclick="bootEngineWorld()">
  <div class="intro-small">Created By</div>
  <h1 class="intro-star-name">Amtun Noor</h1>
  <div class="intro-sub-details">for</div>
  <div class="intro-kids">Mariam & Hamza</div>
  <div class="game-subtitle">🌟 CLICK TO START 🌟</div>
</div>

<img id="bg1" class="bg-layer" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
<img id="bg2" class="bg-layer" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />

<div id="particle-container"></div>

<div id="hud">
  <div id="level-indicator">LEVEL: <span id="lbl-level">1</span></div>
  <div id="star-score">⭐ <span id="lbl-star-total">0</span></div>
</div>

<div id="star-pop">
  <div class="star-graphic" id="star-anchor">⭐<div class="star-count" id="lbl-star-count">0</div></div>
</div>

<div id="app">
  <div id="tile-wrapper" class="display-tile">
    <div id="letter"></div>
    <div id="action-container">
        <div id="action-icon"></div>
        <div id="action-text"></div>
    </div>
  </div>
</div>

<div id="controls">
  <select id="sel-mode" onchange="setMode(this.value)">
    <option value="manual">Manual</option>
    <option value="auto">Auto Play</option>
  </select>
  <select id="sel-speed" onchange="setSpeed(this.value)">
    <option value="slow">Slow</option>
    <option value="normal" selected>Normal</option>
    <option value="fast">Fast</option>
  </select>
  <button id="btn-play-pause" onclick="togglePlay()">PAUSE</button>
  <button id="btn-next" onclick="triggerNextManual()">NEXT ➡️</button>
</div>

<script>
const AUDIO_BASE = "assets/sounds/";
const THEME_BASE = "assets/images/themes/";

const letters = [
  { char:"ا", file:"alif.mp3", color:"#ff7675" }, { char:"ب", file:"ba.mp3", color:"#fdcb6e" }, 
  { char:"ت", file:"ta.mp3", color:"#00cec9" }, { char:"ث", file:"thaa.mp3", color:"#a5b4fc" }, 
  { char:"ج", file:"jeem.mp3", color:"#ff7675" }, { char:"ح", file:"haa.mp3", color:"#fdcb6e" }, 
  { char:"خ", file:"kha.mp3", color:"#00cec9" }, { char:"د", file:"daal.mp3", color:"#a5b4fc" }, 
  { char:"ذ", file:"thaal.mp3", color:"#ff7675" }, { char:"ر", file:"raa.mp3", color:"#fdcb6e" }, 
  { char:"ز", file:"zaa.mp3", color:"#00cec9" }, { char:"س", file:"seen.mp3", color:"#a5b4fc" }, 
  { char:"ش", file:"sheen.mp3", color:"#ff7675" }, { char:"ص", file:"saad.mp3", color:"#fdcb6e" }, 
  { char:"ض", file:"dad.mp3", color:"#00cec9" }, { char:"ط", file:"toa.mp3", color:"#a5b4fc" }, 
  { char:"ظ", file:"zoa.mp3", color:"#ff7675" }, { char:"ع", file:"ain.mp3", color:"#fdcb6e" }, 
  { char:"غ", file:"ghain.mp3", color:"#00cec9" }, { char:"ف", file:"fa.mp3", color:"#a5b4fc" }, 
  { char:"ق", file:"qaaf.mp3", color:"#ff7675" }, { char:"ك", file:"kaf.mp3", color:"#fdcb6e" }, 
  { char:"ل", file:"laam.mp3", color:"#00cec9" }, { char:"م", file:"meem.mp3", color:"#a5b4fc" }, 
  { char:"ن", file:"noon.mp3", color:"#ff7675" }, { char:"ه", file:"ha.mp3", color:"#fdcb6e" }, 
  { char:"و", file:"waw.mp3", color:"#00cec9" }, { char:"ي", file:"yaa.mp3", color:"#a5b4fc" }
];

const actions = [
  { name:"clap", icon:"👏", sound:"clap.mp3", anim:"anim-shake" },
  { name:"fly", icon:"🦅", sound:"fly.mp3", anim:"anim-fly" },
  { name:"hop", icon:"🐸", sound:"hop.mp3", anim:"anim-hop" },
  { name:"jump", icon:"🦘", sound:"jump.mp3", anim:"anim-jump" },
  { name:"look", icon:"👀", sound:"look.mp3", anim:"anim-pulse" },
  { name:"quiet", icon:"🤫", sound:"quiet.mp3", anim:"anim-pulse" },
  { name:"run", icon:"🏃", sound:"run.mp3", anim:"anim-shake" },
  { name:"sit", icon:"🪑", sound:"sit.mp3", anim:"anim-pulse" },
  { name:"sleep", icon:"😴", sound:"sleep.mp3", anim:"anim-pulse" },
  { name:"spin", icon:"🌀", sound:"spin.mp3", anim:"anim-spin" },
  { name:"stomp", icon:"🦶", sound:"stomp.mp3", anim:"anim-shake" },
  { name:"stretch", icon:"🤸", sound:"stretch.mp3", anim:"anim-fly" },
  { name:"strong", icon:"💪", sound:"strong.mp3", anim:"anim-pulse" },
  { name:"walk", icon:"🚶", sound:"walk.mp3", anim:"anim-hop" },
  { name:"wave", icon:"👋", sound:"wave.mp3", anim:"anim-shake" }
];

const phrases = [
  { file: "amazing.mp3" }, { file: "fantastic.mp3" }, 
  { file: "keep_going.mp3" }, { file: "well_done.mp3" }
];

const themes = [
  { name:"balloon", src: THEME_BASE + "balloon.webp", p:["🎈","🎈","✨","☁️","🌈"], dist:"f-up" },
  { name:"snow1", src: THEME_BASE + "snow.webp", p:["❄️","🌨️","✨","🤍","🏔️"], dist:"v-down" },
  { name:"snow2", src: THEME_BASE + "snow_2.webp", p:["❅","❆","💎","🧊","❄️"], dist:"a-down" },
  { name:"garden", src: THEME_BASE + "garden.webp", p:["🌸","🦋","🌼","🌿","🌹"], dist:"spread" },
  { name:"ocean1", src: THEME_BASE + "ocean.webp", p:["🫧","🐟","🐚","🐳","🐠"], dist:"f-up" },
  { name:"ocean2", src: THEME_BASE + "ocean_2.webp", p:["🫧","🪼","🐙","🦈","🐬"], dist:"s-right" },
  { name:"forest1", src: THEME_BASE + "forest.webp", p:["🍂","🍁","🕊️","🐒","🐢"], dist:"swirl" },
  { name:"forest2", src: THEME_BASE + "forest_2.webp", p:["🦚","🌱","🍄","🍀","🌾"], dist:"pop" },
  { name:"rainbow1", src: THEME_BASE + "rainbow.webp", p:["✨","⭐","🌈","💐","🍓"], dist:"diag" },
  { name:"rainbow2", src: THEME_BASE + "rainbow_2.webp", p:["🍩","🍭","🎨","🎂","💖"], dist:"radial" }
];

const speedMatrix = {
  slow:   { letterWait: 900,  actionWait: 1100, postStar: 1200, autoNext: 1400 },
  normal: { letterWait: 400,  actionWait: 550,  postStar: 600,  autoNext: 800 },
  fast:   { letterWait: 80,   actionWait: 120,  postStar: 150,  autoNext: 250 }
};

let currentIdx = 0, starsCollected = 0, currentLevel = 1;
let currentMode = "manual", currentSpeed = "normal";
let isEngineRunning = false, isPaused = false, bgFlip = true, isBooted = false;
let autoTimeout = null, hudHideTimeout = null;

const ambient = new Audio(AUDIO_BASE + "system/ambient.mp3");

const el = {
  letter: document.getElementById("letter"),
  actionIcon: document.getElementById("action-icon"),
  actionText: document.getElementById("action-text"),
  actionCon: document.getElementById("action-container"),
  pCon: document.getElementById("particle-container"),
  lblStar: document.getElementById("lbl-star-count"),
  lblTotalStars: document.getElementById("lbl-star-total"),
  starPop: document.getElementById("star-pop"),
  lblLevel: document.getElementById("lbl-level"),
  btnNext: document.getElementById("btn-next"),
  btnPlayPause: document.getElementById("btn-play-pause"),
  intro: document.getElementById("intro-splash"),
  controls: document.getElementById("controls")
};

function getSoundPath(filename) {
  if (['amazing.mp3', 'fantastic.mp3', 'keep_going.mp3', 'well_done.mp3'].includes(filename)) return AUDIO_BASE + `phrases/${filename}`;
  if (['level_up.mp3', 'ambient.mp3'].includes(filename)) return AUDIO_BASE + `system/${filename}`;
  if (actions.some(a => a.sound === filename)) return AUDIO_BASE + `actions/${filename}`;
  return AUDIO_BASE + `letters/${filename}`;
}

function resetHudTimer() {
  if (!isBooted) return;
  el.controls.classList.remove("hidden-hud");
  clearTimeout(hudHideTimeout);
  hudHideTimeout = setTimeout(() => { if (!isPaused) el.controls.classList.add("hidden-hud"); }, 2500);
}

function changeThemeEnvironment(themeIdx) {
  const theme = themes[themeIdx % themes.length];
  const nextBg = bgFlip ? document.getElementById("bg2") : document.getElementById("bg1");
  const oldBg = bgFlip ? document.getElementById("bg1") : document.getElementById("bg2");
  
  nextBg.src = `${theme.src}?v=${Date.now()}`;
  nextBg.style.opacity = "1"; 
  oldBg.style.opacity = "0";
  bgFlip = !bgFlip; 
  runThemeParticles(theme);
}

function runThemeParticles(theme) {
  el.pCon.innerHTML = "";
  for (let i = 0; i < 30; i++) {
    const p = document.createElement("div"); p.className = "particle";
    p.textContent = theme.p[Math.floor(Math.random() * theme.p.length)];
    p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
    p.style.fontSize = (22 + Math.random() * 26) + "px";
    
    let tx = 0, ty = 0, rot = 360;
    switch(theme.dist) {
      case "v-down":  tx = (Math.random() - 0.5) * 150; ty = 700; break;
      case "a-down":  tx = -400; ty = 600; break;
      case "spread":  tx = (Math.random() - 0.5) * 1400; ty = (Math.random() - 0.5) * 1000; break;
      case "f-up":    tx = (Math.random() - 0.5) * 200; ty = -700; break;
      case "s-right": tx = 900; ty = (Math.random() - 0.5) * 400; break;
      case "swirl":   tx = (Math.random() - 0.5) * 1000; ty = (Math.random() - 0.5) * 1000; rot = 720; break;
      case "pop":     tx = (Math.random() - 0.5) * 300; ty = (Math.random() - 0.5) * 300; rot = 180; break;
      case "diag":    tx = 600; ty = -600; break;
      case "radial":  const ang = Math.random()*Math.PI*2; tx = Math.cos(ang)*600; ty = Math.sin(ang)*600; break;
    }
    
    p.style.setProperty('--tx', `${tx}px`); p.style.setProperty('--ty', `${ty}px`); p.style.setProperty('--rot', `${rot}deg`);
    p.style.animation = `cross-screen ${4 + Math.random() * 5}s cubic-bezier(0.1, 0.25, 0.25, 1) infinite`;
    el.pCon.appendChild(p);
  }
}

async function playSound(file) {
  return new Promise(res => {
    const s = new Audio(getSoundPath(file));
    s.onended = () => res(); s.onerror = () => res();
    s.play().catch(() => res());
  });
}

async function runSequence() {
  if (isEngineRunning || isPaused) return;
  isEngineRunning = true; el.btnNext.disabled = true;

  const letter = letters[currentIdx % letters.length];
  const action = actions[currentIdx % actions.length];
  const chosenPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  const themeIdx = Math.floor(currentIdx / 3);
  const timing = speedMatrix[currentSpeed];

  const calcLevel = Math.floor(currentIdx / 5) + 1;
  if (calcLevel > currentLevel) {
    currentLevel = calcLevel; el.lblLevel.textContent = currentLevel;
    await playSound("level_up.mp3");
    await new Promise(r => setTimeout(r, 400));
  }

  changeThemeEnvironment(themeIdx);
  
  el.actionCon.style.display = "none";
  el.letter.textContent = letter.char; el.letter.style.color = letter.color;
  el.actionIcon.textContent = action.icon; el.actionIcon.className = "";
  el.actionText.textContent = action.name;

  await playSound(letter.file);
  await new Promise(r => setTimeout(r, timing.letterWait));
  if (isPaused) { isEngineRunning = false; return; }
  
  el.actionCon.style.display = "flex"; 
  el.actionIcon.classList.add(action.anim);
  await playSound(action.sound);
  await new Promise(r => setTimeout(r, timing.actionWait));
  if (isPaused) { isEngineRunning = false; return; }

  await playSound(chosenPhrase.file);

  starsCollected++; 
  el.lblStar.textContent = starsCollected; el.lblTotalStars.textContent = starsCollected;
  el.starPop.classList.add("boom");
  await new Promise(r => setTimeout(r, timing.postStar));
  el.starPop.classList.remove("boom");

  currentIdx++; isEngineRunning = false;
  if (currentMode === "manual") el.btnNext.disabled = false;
  else autoTimeout = setTimeout(runSequence, timing.autoNext);
}

function bootEngineWorld() {
  if (isBooted) return; isBooted = true;
  ambient.loop = true; ambient.volume = 0.15; ambient.play().catch(()=>{});
  el.intro.style.opacity = "0";
  setTimeout(() => { el.intro.remove(); runSequence(); resetHudTimer(); }, 600);
}

// FULL AUDIO SYNCHRONIZATION: Pausing the engine now links into the ambient loop node
function togglePlay() {
  isPaused = !isPaused;
  if (isPaused) { 
    clearTimeout(autoTimeout); 
    ambient.pause(); // Synchronously freeze ambient soundtrack
    el.btnPlayPause.textContent = "PLAY"; 
  }
  else { 
    el.btnPlayPause.textContent = "PAUSE"; 
    ambient.play().catch(()=>{}); // Safely restart the loop
    runSequence(); 
  }
}

function setMode(m) { currentMode = m; if (m === "auto") runSequence(); }
function setSpeed(s) { currentSpeed = s; }
function triggerNextManual() { if (!isEngineRunning) runSequence(); }
</script>
</body>
</html>
