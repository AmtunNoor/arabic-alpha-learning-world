<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Arabic Learning World: TV Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; overflow:hidden; background:#0f172a; 
    font-family:Fredoka,sans-serif; color:#fff; user-select:none;
    height: 100vh; width: 100vw;
  }
  /* CINEMATIC INTRO OVERLAY SPLASH */ /* 15-28 lines addition*/
 
  #intro-splash {
    position: fixed; inset: 0; background: radial-gradient(circle, #1e1b4b 0%, #090514 100%);
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s ease;
  }
  .intro-title { font-size: 24px; letter-spacing: 4px; color: #a5b4fc; text-transform: uppercase; margin-bottom: 5px; opacity: 0; transform: translateY(20px); animation: introFade 0.6s 0.3s forwards; }
  .intro-name { font-size: 54px; font-weight: 700; color: #ffd86b; text-shadow: 0 0 30px rgba(255,216,107,0.4); margin-bottom: 40px; opacity: 0; transform: scale(0.85); animation: introPop 0.8s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .intro-sub { font-size: 20px; letter-spacing: 2px; color: #cbd5e1; margin-bottom: 5px; opacity: 0; animation: introFade 0.6s 1.3s forwards; }
  .intro-kids { font-size: 44px; font-weight: 700; background: linear-gradient(45deg, #ff7675, #6c5ce7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(108,92,231,0.3)); opacity: 0; transform: translateY(15px); animation: introFade 0.7s 1.5s forwards; }
  
  @keyframes introFade { to { opacity:1; transform:translateY(0); } }
  @keyframes introPop { to { opacity:1; transform:scale(1); } }

  /* PATH SELECTOR */
  #path-selector {
    position: fixed; inset: 0; background: radial-gradient(circle, #1e1b4b, #020617);
    z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 30px; transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
  }
  .path-card {
    width: 320px; padding: 25px; border-radius: 30px; text-align: center;
    cursor: pointer; transition: 0.2s; border: 4px solid transparent;
  }
  #card-toddler { background: #0ea5e9; box-shadow: 0 10px 0 #0369a1; }
  #card-chef { background: #f59e0b; box-shadow: 0 10px 0 #b45309; }
  
  .tv-focused {
    border-color: #ffffff !important;
    transform: scale(1.06);
    box-shadow: 0 0 30px #ffffff !important;
  }

  #game-stage { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  
  /* TODDLER STAGE */
  #vowel-stage { display: none; text-align: center; }
  .bubble-letter {
    font-size: 160px; width: 240px; height: 240px; background: rgba(255,255,255,0.1);
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    border: 8px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    margin-bottom: 40px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
  }
  .harakah-mark { position: absolute; top: -20px; font-size: 80px; color: #ffd86b; width: 100%; text-align: center; }
  .vowel-btns { display: flex; gap: 25px; justify-content: center; }
  .v-btn { 
    width: 110px; height: 110px; border-radius: 50%; font-size: 55px; 
    border: 4px solid transparent; cursor: pointer; transition: 0.2s; 
    display: flex; align-items: center; justify-content: center; color: white;
  }

  /* KITCHEN CHEF STAGE */
  #chef-stage { display: none; width: 100vw; height: 100vh; position: relative; background: #fef08a; background-image: linear-gradient(#fde047 2px, transparent 2px), linear-gradient(90deg, #fde047 2px, transparent 2px); background-size: 40px 40px; }
  .shelf-back { position: absolute; top: 120px; left: 10%; right: 10%; height: 20px; background: #854d0e; border-radius: 10px; box-shadow: 0 8px 0 rgba(0,0,0,0.15); display: flex; justify-content: space-around; padding: 0 40px; }
  .oil-bottle { position: absolute; bottom: 20px; width: 60px; height: 90px; background: #eab308; border-radius: 15px 15px 5px 5px; border: 4px solid transparent; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 0 rgba(0,0,0,0.2); }
  .oil-bottle::before { content:''; position: absolute; top: -20px; left: 18px; width: 16px; height: 20px; background: #a16207; border-radius: 5px; }
  .oil-label { position: absolute; inset: 25px 5px 10px 5px; background: #fef08a; border-radius: 5px; color: #854d0e; font-size: 11px; text-align: center; font-weight: bold; padding-top: 10px;}
  .egg-station { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; height: 150px; justify-content: center; width: 100%; z-index: 100; }
  .egg-container { position: relative; width: 110px; height: 140px; display: flex; flex-direction: column; align-items: center; }
  .cartoon-egg { width: 100px; height: 130px; background: #fff7ed; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #334155; cursor: pointer; border: 4px solid transparent; box-shadow: 0 8px 0 #fed7aa, inset -10px -10px 0 #ffedd5; transition: 0.2s; }
  .countertop { position: absolute; bottom: 0; left: 0; right: 0; height: 260px; background: #e2e8f0; border-top: 12px solid #cbd5e1; display: flex; justify-content: center; align-items: flex-start; }
  .stove-burner { width: 340px; height: 35px; background: #475569; border-radius: 50%; margin-top: 20px; position: relative; border: 4px solid #334155; }
  .cooking-pan { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 280px; height: 75px; background: #1e293b; border-radius: 0 0 50px 50px; border: 6px solid #475569; }
  .pan-handle { position: absolute; right: -120px; top: 15px; width: 120px; height: 18px; background: #0f172a; border-radius: 0 10px 10px 0; }
  .oil-stream { position: absolute; top: 130px; left: 50%; width: 12px; height: 0; background: rgba(234, 179, 8, 0.7); border-radius: 6px; z-index: 50; transition: height 0.4s ease; }
  .oil-puddle { position: absolute; bottom: 5px; left: 40px; right: 40px; height: 0; background: rgba(234, 179, 8, 0.5); border-radius: 50%; transition: height 0.6s ease; }
  
  #chef-msg-box { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.85); padding: 15px 40px; border-radius: 50px; text-align: center; border: 3px solid #f59e0b; }
  #target-display { font-size: 45px; color: #ffd86b; margin-bottom: 5px; letter-spacing: 4px; }
  #back-btn { position: fixed; top: 20px; left: 20px; padding: 10px 20px; background: rgba(0,0,0,0.5); border-radius: 20px; cursor: pointer; z-index: 10000; border: 2px solid transparent; }
  
  /* ANIMATIONS */
  .jump { animation: jumpAnim 0.5s ease; }
  @keyframes jumpAnim { 0%, 100%{transform:translateY(0);} 50%{transform:translateY(-80px) scaleX(0.85);} }
  .shiver { animation: shiverAnim 0.15s infinite; }
  @keyframes shiverAnim { 0%{transform:translateX(-4px) translateY(-2px);} 100%{transform:translateX(4px) translateY(2px);} }
  .roll { animation: rollAnim 0.5s linear; }
  @keyframes rollAnim { 100%{transform: rotate(360deg);} }
  
  .pour-oil { animation: pourOilAnim 1.2s forwards; }
  @keyframes pourOilAnim {
    0% { transform: translate(160px, -150px) rotate(-70deg); }
    30%, 70% { transform: translate(160px, -150px) rotate(-110deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .egg-splat { animation: eggSplatAnim 0.6s forwards; }
  @keyframes eggSplatAnim {
    0% { transform: translateY(0) scale(1); }
    60% { transform: translateY(280px) scale(1); opacity: 1; }
    100% { transform: translateY(310px) scale(1.6, 0.4); opacity: 0; }
  }
  .egg-crack { animation: eggCrackAnim 0.5s forwards; }
  @keyframes eggCrackAnim {
    50% { transform: translateY(60px) scale(1.1); opacity: 0.8; }
    100% { transform: translateY(100px) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<div id="path-selector">
  <h1 style="font-size: 46px; margin-bottom: 0;">Select Learning Path</h1>
  <p style="color: #94a3b8;">Use Left/Right Arrows & Space/Enter to select</p>
  
  <div style="display: flex; gap: 40px;">
    <div class="path-card tv-focused" id="card-toddler" onclick="startPath('toddler')">
      <div style="font-size: 60px;">🎈</div>
      <h2>Vowel Pop</h2>
      <p>Dynamic Fatha, Kasra, Damma </p>
    </div>

    <div class="path-card" id="card-chef" onclick="startPath('chef')">
      <div style="font-size: 60px;">🍳</div>
      <h2>Kitchen Chef</h2>
      <p>Lets fry eggs!</p>
    </div>
  </div>
</div>

<div id="back-btn" onclick="goHome()">🏠 Menu</div>

<div id="game-stage">
  
  <!-- TODDLER MODE -->
  <div id="vowel-stage">
    <div>
      <div id="toddler-bubble" class="bubble-letter">
        <span id="harakah-visual" class="harakah-mark"></span>
        <span id="base-letter">ج</span>
      </div>
    </div>
    <div class="vowel-btns">
      <button class="v-btn tv-focused" id="vbtn-0" style="background:#ef4444; box-shadow: 0 8px 0 #991b1b;" onclick="vowelAction('fatha')">َ</button>
      <button class="v-btn" id="vbtn-1" style="background:#3b82f6; box-shadow: 0 8px 0 #1e40af;" onclick="vowelAction('kasra')">ِ</button>
      <button class="v-btn" id="vbtn-2" style="background:#22c55e; box-shadow: 0 8px 0 #166534;" onclick="vowelAction('damma')">ُ</button>
    </div>
    <h2 id="vowel-name" style="margin-top: 40px; font-size: 36px; color: #ffd86b;">CHOOSE A VOWEL HARAKAH</h2>
  </div>

  <!-- KITCHEN CHEF MODE -->
  <div id="chef-stage">
    <div id="chef-msg-box">
      <div id="target-display">دَرَسَ</div>
      <div id="chef-prompt" style="font-size: 18px; color: #cbd5e1;">Pour the cooking oil first!</div>
    </div>
    
    <div class="shelf-back">
      <div id="oil-item" class="oil-bottle tv-focused" onclick="triggerOilPour()">
        <div class="oil-label">OIL</div>
      </div>
    </div>
    
    <div class="egg-station" id="egg-shelf" style="display: none;"></div>
    
    <div class="oil-stream" id="oil-pour-line"></div>
    <div class="cooking-pan">
      <div class="oil-puddle" id="pan-oil-level"></div>
      <div class="pan-handle"></div>
    </div>
    <div class="countertop">
      <div class="stove-burner"></div>
    </div>
  </div>

</div>

<script>
// RAW GITHUB MEDIA PATH RESOLUTION INFRASTRUCTURE
const REPO_SOUNDS_URL = "https://raw.githubusercontent.com/AmtunNoor/arabic-alpha-learning-world/main/assets/sounds/letters/";

const lettersData = [
  { char: "ج", file: "jeem.mp3", color: "#ff7675" },
  { char: "ب", file: "ba.mp3", color: "#fdcb6e" },
  { char: "ت", file: "ta.mp3", color: "#00cec9" },
  { char: "د", file: "daal.mp3", color: "#6c5ce7" },
  { char: "ر", file: "raa.mp3", color: "#ff7675" },
  { char: "س", file: "seen.mp3", color: "#00cec9" }
];

const wordsBank = [
  { combined: "دَرَسَ", sequence: [3, 4, 5] },
  { combined: "بَرَدَ", sequence: [1, 4, 3] }
];

let activeScreen = "menu";
let toddlerIdx = 0;
let chefWordIdx = 0;
let chefPhase = "oil"; 
let chefStep = 0;
let focusedElementIdx = 0;
let currentEggSequence = [];

// CENTRALIZED PITCH SHIFT SOUND PLAYER ENGINE
async function playShiftedSound(filename, rate = 1.0) {
  return new Promise(resolve => {
    try {
      const audio = new Audio(`${REPO_SOUNDS_URL}${filename}`);
      audio.defaultPlaybackRate = rate;
      audio.playbackRate = rate;
      audio.onended = () => resolve();
      audio.onerror = () => resolve();
      audio.play().catch(() => resolve());
    } catch(err) {
      resolve();
    }
  });
}

function startPath(path) {
  document.getElementById("path-selector").style.transform = "translateY(-100%)";
  focusedElementIdx = 0;
  
  if(path === 'toddler') {
    activeScreen = "toddler";
    document.getElementById("vowel-stage").style.display = "block";
    loadToddlerLetter();
    updateVowelFocus();
  } else {
    activeScreen = "chef";
    document.getElementById("chef-stage").style.display = "block";
    resetChefGame();
  }
}

function goHome() {
  document.getElementById("path-selector").style.transform = "translateY(0)";
  document.getElementById("vowel-stage").style.display = "none";
  document.getElementById("chef-stage").style.display = "none";
  activeScreen = "menu";
  focusedElementIdx = 0;
  updateMenuFocus();
}

function updateMenuFocus() {
  document.getElementById("card-toddler").classList.toggle("tv-focused", focusedElementIdx === 0);
  document.getElementById("card-chef").classList.toggle("tv-focused", focusedElementIdx === 1);
}

function updateVowelFocus() {
  for (let i = 0; i < 3; i++) {
    document.getElementById(`vbtn-${i}`).classList.toggle("tv-focused", focusedElementIdx === i);
  }
}

/* --- TODDLER VOWEL POP ENGINE WITH AUTOMATED WEB AUDIO PITCH --- */
function loadToddlerLetter() {
  const l = lettersData[toddlerIdx % lettersData.length];
  document.getElementById("base-letter").textContent = l.char;
  document.getElementById("toddler-bubble").style.color = l.color;
  document.getElementById("harakah-visual").textContent = ""; 
  playShiftedSound(l.file, 1.0); // Standard playback for raw base letter sound induction
}

async function vowelAction(type) {
  const b = document.getElementById("toddler-bubble");
  const visualMark = document.getElementById("harakah-visual");
  const nameLabel = document.getElementById("vowel-name");
  const l = lettersData[toddlerIdx % lettersData.length];

  b.className = "bubble-letter"; 
  void b.offsetWidth; 

  let targetPitch = 1.0;
  if(type === 'fatha') {
    b.classList.add("jump");
    visualMark.textContent = "َ";
    nameLabel.textContent = "FATHA!";
    targetPitch = 1.15; // Higher, open sound signature
  } else if(type === 'kasra') {
    b.classList.add("shiver");
    visualMark.textContent = "ِ";
    nameLabel.textContent = "KASRA!";
    targetPitch = 1.35; // Sharp, squeaky peak signature
  } else {
    b.classList.add("roll");
    visualMark.textContent = "ُ";
    nameLabel.textContent = "DAMMA!";
    targetPitch = 0.85; // Deeper, rounder register signature
  }

  await playShiftedSound(l.file, targetPitch);
  
  setTimeout(() => {
    toddlerIdx++;
    loadToddlerLetter();
    nameLabel.textContent = "CHOOSE A VOWEL HARAKAH";
    b.className = "bubble-letter";
  }, 2200);
}

/* --- KITCHEN CHEF STEP ENGINE --- */
function resetChefGame() {
  chefPhase = "oil";
  chefStep = 0;
  focusedElementIdx = 0;
  
  document.getElementById("oil-item").style.display = "block";
  document.getElementById("oil-item").className = "oil-bottle tv-focused";
  document.getElementById("egg-shelf").style.display = "none";
  document.getElementById("pan-oil-level").style.height = "0px";
  document.getElementById("chef-prompt").textContent = "Pour the cooking oil first!";
  
  const word = wordsBank[chefWordIdx % wordsBank.length];
  document.getElementById("target-display").textContent = word.combined;
}

function triggerOilPour() {
  if (chefPhase !== "oil") return;
  chefPhase = "busy"; 
  
  const oil = document.getElementById("oil-item");
  oil.classList.remove("tv-focused");
  oil.classList.add("pour-oil");
  
  setTimeout(() => {
    document.getElementById("oil-pour-line").style.height = "160px";
    playShiftedSound("oil_sizzle.mp3", 1.0); 
  }, 300);

  setTimeout(() => {
    document.getElementById("oil-pour-line").style.height = "0px";
    document.getElementById("pan-oil-level").style.height = "25px";
  }, 900);

  setTimeout(() => {
    oil.style.display = "none";
    setupEggPhase();
  }, 1300);
}

function setupEggPhase() {
  chefPhase = "eggs";
  focusedElementIdx = 0;
  document.getElementById("chef-prompt").textContent = "Find the first letter sound & break the egg!";
  
  const word = wordsBank[chefWordIdx % wordsBank.length];
  currentEggSequence = [...word.sequence].sort(() => Math.random() - 0.5);
  
  renderEggTray();
}

function renderEggTray() {
  const shelf = document.getElementById("egg-shelf");
  shelf.innerHTML = "";
  shelf.style.display = "flex";
  
  currentEggSequence.forEach((letterIdx, pos) => {
    const container = document.createElement("div");
    container.className = "egg-container";
    
    if (letterIdx !== null) {
      const egg = document.createElement("div");
      egg.className = "cartoon-egg";
      egg.textContent = lettersData[letterIdx].char;
      egg.onclick = () => processEggSelection(letterIdx, pos, egg);
      container.appendChild(egg);
    }
    shelf.appendChild(container);
  });
  
  updateChefFocus();
}

function updateChefFocus() {
  const eggs = document.querySelectorAll(".cartoon-egg");
  eggs.forEach((egg, idx) => {
    egg.classList.toggle("tv-focused", focusedElementIdx === idx);
  });
}

async function processEggSelection(letterIdx, pos, eggElement) {
  const word = wordsBank[chefWordIdx % wordsBank.length];
  const targetIdx = word.sequence[chefStep];
  
  if (letterIdx === targetIdx) {
    eggElement.classList.add("egg-crack");
    await playShiftedSound(lettersData[letterIdx].file, 1.0);
    
    chefStep++;
    currentEggSequence[pos] = null; 
    
    setTimeout(() => {
      renderEggTray();
      focusedElementIdx = 0;
      updateChefFocus();
    }, 500);

    if (chefStep === 3) {
      document.getElementById("chef-prompt").textContent = "Perfect Cooking! Delicious word ready!";
      setTimeout(() => {
        chefWordIdx++;
        resetChefGame();
      }, 2500);
    } else {
      document.getElementById("chef-prompt").textContent = "Yum! Next letter sound?";
    }
  } else {
    eggElement.classList.add("egg-splat");
    playShiftedSound("egg_splat.mp3", 1.0); 
    
    setTimeout(() => {
      eggElement.classList.remove("egg-splat");
      document.getElementById("chef-prompt").textContent = "Oops! Wrong ingredient combination!";
    }, 600);
  }
}

/* --- TV KEY NAVIGATION HANDLING --- */
window.addEventListener("keydown", (e) => {
  if (activeScreen === "menu") {
    if (e.key === "ArrowLeft") { focusedElementIdx = 0; updateMenuFocus(); }
    if (e.key === "ArrowRight") { focusedElementIdx = 1; updateMenuFocus(); }
    if (e.key === "Space" || e.key === "Enter" || e.code === "Space") {
      e.preventDefault();
      if (focusedElementIdx === 0) startPath('toddler');
      else startPath('chef');
    }
  }
  else if (activeScreen === "toddler") {
    if (e.key === "ArrowLeft") {
      focusedElementIdx = (focusedElementIdx - 1 + 3) % 3;
      updateVowelFocus();
    }
    if (e.key === "ArrowRight") {
      focusedElementIdx = (focusedElementIdx + 1) % 3;
      updateVowelFocus();
    }
    if (e.key === "Space" || e.key === "Enter" || e.code === "Space") {
      e.preventDefault();
      document.getElementById(`vbtn-${focusedElementIdx}`).click();
    }
  }
  else if (activeScreen === "chef") {
    if (chefPhase === "oil") {
      if (e.key === "Space" || e.key === "Enter" || e.code === "Space") {
        e.preventDefault();
        triggerOilPour();
      }
    } 
    else if (chefPhase === "eggs") {
      const liveEggs = document.querySelectorAll(".cartoon-egg");
      if (liveEggs.length === 0) return;

      if (e.key === "ArrowLeft") {
        focusedElementIdx = (focusedElementIdx - 1 + liveEggs.length) % liveEggs.length;
        updateChefFocus();
      }
      if (e.key === "ArrowRight") {
        focusedElementIdx = (focusedElementIdx + 1) % liveEggs.length;
        updateChefFocus();
      }
      if (e.key === "Space" || e.key === "Enter" || e.code === "Space") {
        e.preventDefault();
        liveEggs[focusedElementIdx]?.click();
      }
    }
  }
});
</script>
</body>
</html>-=
